name: Dependency audit
# Weekly check of the image's exact versions (deploy/constraints.txt) against known vulnerabilities, and on demand.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: pip-audit -r deploy/constraints.txt
