name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    # n235: 1.63.0 (Chromium build 1243) honours media on a video's <source>, so tests/test_n161_film_by_device.py checks
    # the 4:5 film on phones here; 1.49.1 (Chromium 131) played the 16:9 one. The same build as the cloud sessions' browser.
    env: { PLAYWRIGHT_VERSION: "1.63.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pip's cache (downloaded wheels) is kept per Python version and the hash of the pins; pip still installs every run
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/constraints.txt
            pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: pip install -c deploy/constraints.txt -e ".[server,test]"     # the image's exact versions; a bad pin fails here, not in az acr build
      # The browser checks (tests/test_browser.py) run when Playwright's Chromium is present; they are skipped otherwise.
      # The browsers are cached per Playwright version, and apt (--with-deps) runs only when Chromium does not start
      # without it: the runner image already carries the libraries Chrome needs, and the Ubuntu mirror was the slow part
      # of this job (25.9 MB in 9 minutes on 26 October 2026, while the browsers downloaded in 6 seconds).
      - run: npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}" }
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: node -e "require('playwright').chromium.launch().then(b => b.close())" || npx playwright install-deps chromium
      # n189: tests/test_n189_rayfin_design.py writes its screenshots of the generated Rayfin App (1280 x 720 and 375 x 812,
      # light and dark) here; they are kept as an artifact of the run, never committed
      # CI1: the suite runs on every CPU of the runner (pytest-xdist, pinned in the test extra); serially the job took 21 min
      # 44 s (run 43971148114, 16 November 2026). --dist loadscope keeps a test file on one worker, so its module fixtures
      # (a local server, a Chromium script of up to 4.5 minutes in tests/test_browser.py) run once, not once per worker.
      # --durations=30 lists the slowest tests in the log.
      - run: pytest -q -n auto --dist loadscope --durations=30
        env: { RAYFIN_APP_SHOTS: "${{ runner.temp }}/rayfin-app-shots" }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: rayfin-app-shots, path: "${{ runner.temp }}/rayfin-app-shots", if-no-files-found: ignore, retention-days: 14 }
  notebooks:
    # The generated Fabric notebooks (silver tables, drift monitor) run on a local Spark against the shop seed:
    # tests/test_spark_notebooks.py imports only pure modules, so no server dependencies; Delta is not available in a
    # local Spark, so the tests write parquet. The import check fails the job instead of letting the tests skip.
    # WB1 (F8): on PySpark 3.5.3 too, the Spark line of Fabric Runtime 1.3 that the notebooks name, with that runtime's
    # Python 3.11 (PySpark 3.5's toPandas imports distutils, which Python 3.12 dropped), next to 4.0.1 on 3.12; the two
    # run side by side, so the job takes no longer than before.
    name: notebooks (pyspark ${{ matrix.pyspark }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pyspark: "3.5.3", python: "3.11" }
          - { pyspark: "4.0.1", python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pyspark comes as a 434 MB source package that pip builds into a wheel each time; the cache keeps the built wheel,
      # keyed on this file, where the versions are pinned
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: .github/workflows/ci.yml }
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "17" }
      - run: pip install "pyspark==${{ matrix.pyspark }}" requests pytest "pandas==2.3.3" "openpyxl==3.1.5"   # pandas and openpyxl: the Excel file of the Connect file route
      - run: python -c "import pyspark, requests; print(pyspark.__version__); assert pyspark.__version__ == '${{ matrix.pyspark }}'"
      - run: python -m pytest -q -rs --noconftest tests/test_spark_notebooks.py tests/test_b3_connect_files_spark.py
  notices:
    # THIRD_PARTY_NOTICES.md is generated from the pins (tools/third_party_notices.py): the job fails when the file is
    # stale or a dependency is under the AGPL or the SSPL (CONTRIBUTING.md, "Reusing external code"). --from-installed
    # reads the metadata of what pip just installed from the same pins instead of PyPI's JSON API, so a slow or
    # unreachable pypi.org cannot turn it red on its own. A Dependabot pip PR is red here until the file is regenerated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/constraints.txt
            pyproject.toml
      - run: pip install -c deploy/constraints.txt -e ".[server,test,databricks]"
      - run: python tools/third_party_notices.py --check --from-installed
  workload:
    # The Fabric workload's frontend (workload/Workload, a fork of Microsoft's starter kit): its unit tests (definition
    # load and save, the version field) and a type check. Separate from the Python jobs, which do not need npm for it.
    # --ignore-scripts: the kit's nuget-bin downloads nuget.exe on install, which only packaging the manifest needs.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: workload/Workload } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # n195: both packages build, and Krusgraph.Modeler's passes the publishing checks (attestation link, publisher,
      # en-US texts, https support links, icon and banner sizes; workload/scripts/build_package.py check_publishing).
      # The app id is the workload app's public client id (docs/WORKLOAD-PUBLISH.md); nothing is uploaded.
      - name: Build the workload packages (Org.Krusgraph and Krusgraph.Modeler)
        working-directory: .
        run: |
          for name in Org.Krusgraph Krusgraph.Modeler; do
            python3 workload/scripts/build_package.py --name "$name" --frontend-app-id 853a0cf0-7d35-42b7-b384-26178755a72a \
              --version 1.0.0 --out "$RUNNER_TEMP/package" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          test -f "$RUNNER_TEMP/package/Krusgraph.Modeler.1.0.0.nupkg"
          unzip -p "$RUNNER_TEMP/package/Krusgraph.Modeler.1.0.0.nupkg" FE/Product.json | grep -q '"https://krusgraph.com/workload/attestation"'
      # W12: the upload-ready Krusgraph.Modeler package, built with the default name (the one constant WORKLOAD_NAME in
      # build_package.py) and the version 1.0.<commits on main>, so it is higher than any package Fabric has; then the dry,
      # offline validation (workload/scripts/validate_package.py: parts, name, version, the kit's XSDs, the publishing
      # fields) and the package kept as an artifact for docs/MODELER-GO-LIVE.md. Nothing is registered or uploaded.
      - name: Fetch the whole history (the package version counts the commits)
        working-directory: .
        run: git fetch --unshallow --quiet || true
      - name: Build and validate the upload-ready Krusgraph.Modeler package
        id: modeler
        working-directory: .
        run: |
          set -o pipefail
          name=$(python3 -c "import importlib.util as u; s=u.spec_from_file_location('b','workload/scripts/build_package.py'); m=u.module_from_spec(s); s.loader.exec_module(m); print(m.WORKLOAD_NAME)")
          out="$RUNNER_TEMP/modeler"
          python3 workload/scripts/build_package.py --frontend-app-id 853a0cf0-7d35-42b7-b384-26178755a72a --out "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          pkg=$(ls "$out"/"$name".*.nupkg)
          # xmllint (libxml2-utils) checks the XML against the kit's XSDs; the runner image does not always carry it
          command -v xmllint >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; }
          python3 workload/scripts/validate_package.py "$pkg" --require-xsd --report "$out/VALIDATION.md" | tee -a "$GITHUB_STEP_SUMMARY"
          (cd "$out" && sha256sum "$(basename "$pkg")" > SHA256SUMS.txt)
          echo "artifact=$(basename "$pkg" .nupkg)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "${{ steps.modeler.outputs.artifact }}", path: "${{ runner.temp }}/modeler", if-no-files-found: error, retention-days: 90 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: workload/Workload/package-lock.json }
      # npm ci of the kit's 712 packages runs out of the default 4 GB heap (runs 738 and 739; reproduced locally), and
      # finishes with 8 GB, the value the kit's own npm scripts use
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env: { NODE_OPTIONS: --max-old-space-size=8192 }
      - run: npm test
      - run: npm run typecheck
      # n168: the production build the Dockerfile's "editor" stage makes for workload.krusgraph.com, so a break shows here
      # and not in the maintainer's az acr build
      - run: npx webpack --config ./webpack.config.js --output-path "$RUNNER_TEMP/editor" --mode production && test -f "$RUNNER_TEMP/editor/index.html"
        env: { WORKLOAD_NAME: Org.Krusgraph, ITEM_NAMES: Model, WORKLOAD_VERSION: "1.0.0", LOG_LEVEL: info, ENABLE_PLAYGROUND: "false" }
