name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[server,test]"
      # The browser checks (tests/test_browser.py) run when Playwright's Chromium is present; they are skipped otherwise.
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: pytest -q
