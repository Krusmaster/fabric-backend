name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    env: { PLAYWRIGHT_VERSION: "1.49.1" }
    steps:
      - uses: actions/checkout@v5
      # pip's cache (downloaded wheels) is kept per Python version and the hash of the pins; pip still installs every run
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/constraints.txt
            pyproject.toml
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: pip install -c deploy/constraints.txt -e ".[server,test]"     # the image's exact versions; a bad pin fails here, not in az acr build
      # The browser checks (tests/test_browser.py) run when Playwright's Chromium is present; they are skipped otherwise.
      # The browsers are cached per Playwright version, and apt (--with-deps) runs only when Chromium does not start
      # without it: the runner image already carries the libraries Chrome needs, and the Ubuntu mirror was the slow part
      # of this job (25.9 MB in 9 minutes on 26 October 2026, while the browsers downloaded in 6 seconds).
      - run: npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
      - id: browsers
        uses: actions/cache@v5
        with: { path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}" }
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: node -e "require('playwright').chromium.launch().then(b => b.close())" || npx playwright install-deps chromium
      - run: pytest -q
  notebooks:
    # The generated Fabric notebooks (silver tables, drift monitor) run on a local Spark against the shop seed:
    # tests/test_spark_notebooks.py imports only pure modules, so no server dependencies; Delta is not available in a
    # local Spark, so the tests write parquet. The import check fails the job instead of letting the tests skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pyspark comes as a 434 MB source package that pip builds into a wheel each time; the cache keeps the built wheel,
      # keyed on this file, where the versions are pinned
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/ci.yml }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - run: pip install "pyspark==4.0.1" requests pytest
      - run: python -c "import pyspark, requests; print(pyspark.__version__)"
      - run: python -m pytest -q -rs --noconftest tests/test_spark_notebooks.py
