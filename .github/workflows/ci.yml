name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    env: { PLAYWRIGHT_VERSION: "1.49.1" }
    steps:
      - uses: actions/checkout@v7
      # pip's cache (downloaded wheels) is kept per Python version and the hash of the pins; pip still installs every run
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/constraints.txt
            pyproject.toml
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: pip install -c deploy/constraints.txt -e ".[server,test]"     # the image's exact versions; a bad pin fails here, not in az acr build
      # The browser checks (tests/test_browser.py) run when Playwright's Chromium is present; they are skipped otherwise.
      # The browsers are cached per Playwright version, and apt (--with-deps) runs only when Chromium does not start
      # without it: the runner image already carries the libraries Chrome needs, and the Ubuntu mirror was the slow part
      # of this job (25.9 MB in 9 minutes on 26 October 2026, while the browsers downloaded in 6 seconds).
      - run: npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
      - id: browsers
        uses: actions/cache@v6
        with: { path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}" }
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: node -e "require('playwright').chromium.launch().then(b => b.close())" || npx playwright install-deps chromium
      - run: pytest -q
  notebooks:
    # The generated Fabric notebooks (silver tables, drift monitor) run on a local Spark against the shop seed:
    # tests/test_spark_notebooks.py imports only pure modules, so no server dependencies; Delta is not available in a
    # local Spark, so the tests write parquet. The import check fails the job instead of letting the tests skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pyspark comes as a 434 MB source package that pip builds into a wheel each time; the cache keeps the built wheel,
      # keyed on this file, where the versions are pinned
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/ci.yml }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - run: pip install "pyspark==4.0.1" requests pytest
      - run: python -c "import pyspark, requests; print(pyspark.__version__)"
      - run: python -m pytest -q -rs --noconftest tests/test_spark_notebooks.py
  notices:
    # THIRD_PARTY_NOTICES.md is generated from the pins (tools/third_party_notices.py): the job fails when the file is
    # stale or a dependency is under the AGPL or the SSPL (CONTRIBUTING.md, "Reusing external code"). --from-installed
    # reads the metadata of what pip just installed from the same pins instead of PyPI's JSON API, so a slow or
    # unreachable pypi.org cannot turn it red on its own. A Dependabot pip PR is red here until the file is regenerated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deploy/constraints.txt
            pyproject.toml
      - run: pip install -c deploy/constraints.txt -e ".[server,test,databricks]"
      - run: python tools/third_party_notices.py --check --from-installed
  workload:
    # The Fabric workload's frontend (workload/Workload, a fork of Microsoft's starter kit): its unit tests (definition
    # load and save, the version field) and a type check. Separate from the Python jobs, which do not need npm for it.
    # --ignore-scripts: the kit's nuget-bin downloads nuget.exe on install, which only packaging the manifest needs.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: workload/Workload } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: workload/Workload/package-lock.json }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      # n168: the production build the Dockerfile's "editor" stage makes for workload.krusgraph.com, so a break shows here
      # and not in the maintainer's az acr build
      - run: npx webpack --config ./webpack.config.js --output-path "$RUNNER_TEMP/editor" --mode production && test -f "$RUNNER_TEMP/editor/index.html"
        env: { WORKLOAD_NAME: Org.Krusgraph, ITEM_NAMES: Model, WORKLOAD_VERSION: "1.0.0", LOG_LEVEL: info, ENABLE_PLAYGROUND: "false" }
