# Monthly update PRs for the Python dependencies (pyproject.toml, deploy/constraints.txt) and the Actions in
# .github/workflows (pinned by commit, with the version in a comment, which Dependabot updates together), and the Fabric
# workload editor's npm packages (workload/Workload, B2): one PR per ecosystem and month, with every update of that ecosystem in it.
#
# Nobody has to approve them: a Deployment round (CONTRIBUTING.md, "Deployment") rebases each PR onto main, waits for
# green CI and squash-merges it; a red PR is fixed in place when the cause is a simple consequence of the update, and
# closed with a comment that says what is needed otherwise.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    groups:
      all: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /deploy
    schedule: { interval: monthly }
    groups:
      all: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      all: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /workload/Workload
    schedule: { interval: monthly }
    groups:
      all: { patterns: ["*"] }
    # n243: majors are left out (PR #25 brought React 19, react-router 7, TypeScript 7, vitest 5 at once); the editor is a
    # fork of Microsoft's starter kit, so it moves to a new major when the kit does, in a round of its own.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
