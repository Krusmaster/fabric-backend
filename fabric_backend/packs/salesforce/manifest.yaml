  - {"id": "ms_copy_job_create", "title": "Microsoft Learn: Create a Copy job (by default the same table name, column name and data type as the source)", "url": "https://learn.microsoft.com/en-us/fabric/data-factory/create-copy-job", "publisher": "Microsoft", "accessed": "2026-11-17", "verified": true, "note": "Read on 17 November 2026: the optional table or column mapping renames tables or columns in the destination; by default data is copied with the same table name, column name and data type as the source."}
