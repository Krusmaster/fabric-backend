  - {"id": "ms_mirroring_overview", "title": "Microsoft Learn: Mirroring in Fabric, overview (the sources database mirroring supports)", "url": "https://learn.microsoft.com/en-us/fabric/mirroring/overview", "publisher": "Microsoft", "accessed": "2026-11-17", "verified": true, "note": "Read on 17 November 2026: the table of supported sources lists Azure and other databases (Azure SQL, Cosmos DB, PostgreSQL, MySQL, Databricks, Dremio, BigQuery, Oracle, SAP Datasphere, SharePoint List, Snowflake, SQL Server and others) and no Salesforce source."}
