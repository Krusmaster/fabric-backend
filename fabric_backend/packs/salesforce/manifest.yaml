  - {"id": "sf_id_field_type", "title": "Salesforce Object Reference: field types, the ID field type (15-character case-sensitive ids; the 18-character case-safe form every API call returns; OwnerId holds the owning user's id)", "url": "https://developer.salesforce.com/docs/platform/object-reference/guide/field-types.html", "publisher": "Salesforce", "accessed": "2026-11-17", "verified": true, "note": "Read on 17 November 2026. The page says that ids are often shown as 15 case-sensitive characters, that all API calls return an 18-character case-safe id whose last three characters encode the case of the first fifteen, that truncating the last three gives the 15-character form, that an id carries a three-character code for the object type (describeSObjects returns it), and that OwnerId holds the id of the user who owns the record. The old atlas URL (atlas.en-us.api.meta/api/field_types.htm) redirects elsewhere."}
