  - {"from": "OPPORTUNITY.CONTACT_ID", "to": "CONTACT.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Salesforce pack", "applied": false, "role": "contact", "condition": "Settable on create only (API 46.0 and later) and not kept in step with the contact roles; OPPORTUNITYCONTACTROLE holds the opportunity's contacts. Listed so a model has one path from opportunity to contact.", "validation": ["referential_integrity", "cardinality"], "sources": ["sf_obj_opportunity"]}
