entities:
  - {"name": "ACCOUNT", "module": "salesforce", "level": "master", "title": "Salesforce Account (a company, or a person in orgs with person accounts)", "key": ["ID"], "area": "customers", "note": "PARENT_ID names the parent account in a hierarchy (a reference to Account itself). In an org with person accounts an Account row can be a person (IS_PERSON_ACCOUNT), and its name is then personal data; the person fields come from the account's person contact. OWNER_ID is the owning user.", "sources": ["sf_obj_account", "sf_fields_account"]}
  - {"name": "ASSET", "module": "salesforce", "level": "master", "title": "Asset (a product a customer owns or uses, with serial number, dates and price)", "key": ["ID"], "area": "service", "note": "ACCOUNT_ID and CONTACT_ID say whose asset it is, PRODUCT2_ID what it is. PRICE is what was paid for this asset, not a line of an order: summed with order lines it counts the same sale twice when the asset came from an order. PARENT_ID and ROOT_ASSET_ID build an asset hierarchy.", "sources": ["sf_obj_asset", "sf_fields_asset"]}
  - {"name": "CAMPAIGN", "module": "salesforce", "level": "header", "title": "Campaign (a marketing initiative: an event, a mailing, an advertisement)", "key": ["ID"], "amounts": [{"column": "AMOUNT_ALL_OPPORTUNITIES", "level": "header", "currency": "CURRENCY_ISO_CODE when the org has multi-currency enabled; otherwise the org's corporate currency, and there is no currency column"}, {"column": "AMOUNT_WON_OPPORTUNITIES", "level": "header", "currency": "CURRENCY_ISO_CODE when the org has multi-currency enabled; otherwise the org's corporate currency, and there is no currency column"}, {"column": "BUDGETED_COST", "level": "header", "currency": "CURRENCY_ISO_CODE when the org has multi-currency enabled; otherwise the org's corporate currency, and there is no currency column"}, {"column": "ACTUAL_COST", "level": "header", "currency": "CURRENCY_ISO_CODE when the org has multi-currency enabled; otherwise the org's corporate currency, and there is no currency column"}], "area": "marketing", "note": "AMOUNT_ALL_OPPORTUNITIES and AMOUNT_WON_OPPORTUNITIES are read-only sums Salesforce keeps over the opportunities of the campaign: adding them to OPPORTUNITY.AMOUNT counts the same deals twice, and joined with its opportunities or members they repeat once per row. PARENT_ID names a parent campaign.", "sources": ["sf_obj_campaign", "sf_fields_campaign"]}
  - {"name": "CAMPAIGNMEMBER", "module": "salesforce", "level": "partner", "title": "Campaign member (a lead or a contact in a campaign, with its response status)", "key": ["ID"], "area": "marketing", "note": "Each row names a lead (LEAD_ID) or a contact (CONTACT_ID); a row given both keeps only the contact, except when a converted lead is tracked with both. In orgs with accounts as campaign members ACCOUNT_ID can be set instead. STATUS and HAS_RESPONDED say how the member responded.", "sources": ["sf_obj_campaignmember", "sf_fields_campaignmember"]}
  - {"name": "CASE", "module": "salesforce", "level": "header", "title": "Case (a customer's question, problem or request)", "key": ["ID"], "unique_keys": [["CASE_NUMBER"]], "area": "service", "note": "CASE_NUMBER is assigned automatically and cannot be changed. ACCOUNT_ID and CONTACT_ID can name different customers (the page has a section on separating accounts from contacts). PARENT_ID names a parent case. SUPPLIED_* hold what a web or e-mail form sent, before a contact is matched. OWNER_ID can be a queue (see the trap).", "sources": ["sf_obj_case", "sf_fields_case"]}
  - {"name": "CONTACT", "module": "salesforce", "level": "partner", "title": "Contact (a person, usually at an account)", "key": ["ID"], "area": "customers", "note": "ACCOUNT_ID can be empty (a contact without an account). REPORTS_TO_ID names another contact. Personal data throughout.", "sources": ["sf_obj_contact", "sf_fields_contact"]}
  - {"name": "CONTRACT", "module": "salesforce", "level": "header", "title": "Contract (a business agreement with an account)", "key": ["ID"], "unique_keys": [["CONTRACT_NUMBER"]], "area": "sales", "note": "CONTRACT_NUMBER is an auto-number. START_DATE and CONTRACT_TERM (months) give the term, END_DATE follows. ACCOUNT_ID is required. Opportunities and orders can name the contract.", "sources": ["sf_obj_contract", "sf_fields_contract"]}
  - {"name": "EVENT", "module": "salesforce", "level": "document_flow", "title": "Event (a calendar meeting about a person and a record)", "key": ["ID"], "area": "activities", "note": "WHO_ID and WHAT_ID are polymorphic as on Task (WhatId is labelled Related To ID on the page). ACCOUNT_ID is derived and read-only. START_DATE_TIME, END_DATE_TIME and DURATION_IN_MINUTES time it.", "sources": ["sf_obj_event", "sf_fields_event"]}
  - {"name": "LEAD", "module": "salesforce", "level": "master", "title": "Lead (a prospect not yet qualified; converted into an account, a contact and possibly an opportunity)", "key": ["ID"], "area": "marketing", "note": "IS_CONVERTED, CONVERTED_DATE and CONVERTED_ACCOUNT_ID, CONVERTED_CONTACT_ID, CONVERTED_OPPORTUNITY_ID record a conversion; a converted lead is read-only afterwards and stays in the table beside the contact it became. COMPANY is the prospect's company as text, not a link. OWNER_ID can be a queue (see the trap).", "sources": ["sf_obj_lead", "sf_fields_lead"]}
  - {"name": "OPPORTUNITY", "module": "salesforce", "level": "header", "title": "Opportunity (a sale or pending deal)", "key": ["ID"], "amounts": [{"column": "AMOUNT", "level": "header", "currency": "CURRENCY_ISO_CODE when the org has multi-currency enabled; otherwise the org's corporate currency, and there is no currency column"}], "area": "sales", "note": "With products (OPPORTUNITYLINEITEM) every line item adds its TOTAL_PRICE to AMOUNT, and AMOUNT becomes read-only (the OpportunityLineItem page, 'Effects on Opportunities'); EXPECTED_REVENUE grows by TOTAL_PRICE times PROBABILITY in the same way. Joined with its line items the amount is repeated once per line. STAGE_NAME, IS_CLOSED and IS_WON say where the deal stands; CLOSE_DATE when it closed or is expected to. PRICEBOOK2_ID and CURRENCY_ISO_CODE cannot change once line items exist.", "sources": ["sf_obj_opportunity", "sf_fields_opportunity", "sf_obj_opportunitylineitem"]}
  - {"name": "OPPORTUNITYCONTACTROLE", "module": "salesforce", "level": "partner", "title": "Opportunity contact role (a contact's role on an opportunity; one of them can be primary)", "key": ["ID"], "area": "sales", "note": "A link table between OPPORTUNITY and CONTACT with ROLE and IS_PRIMARY: one opportunity has many contacts and one contact many opportunities. Each opportunity has only one primary contact. Counting opportunities through this table counts an opportunity once per contact.", "sources": ["sf_obj_opportunitycontactrole", "sf_fields_opportunitycontactrole"]}
  - {"name": "OPPORTUNITYLINEITEM", "module": "salesforce", "level": "item", "title": "Opportunity product (a line of an opportunity: a price book entry, a quantity and a price)", "key": ["ID"], "amounts": [{"column": "TOTAL_PRICE", "level": "item", "currency": "the opportunity's currency (OPPORTUNITY.CURRENCY_ISO_CODE in a multi-currency org; the line's own CURRENCY_ISO_CODE is set from it and cannot be changed)"}], "area": "sales", "note": "OPPORTUNITY_ID is required and cannot be updated (a line never moves to another opportunity); the page calls it a relationship, not master-detail. The product is chosen through PRICEBOOK_ENTRY_ID, which must be an entry of the opportunity's price book; PRODUCT2_ID is read-only (API 30.0 and later) and the page says to use the price book entry instead. UNIT_PRICE is the sales price, LIST_PRICE the entry's price, TOTAL_PRICE the line's amount.", "sources": ["sf_obj_opportunitylineitem", "sf_fields_opportunitylineitem"]}
  - {"name": "ORDER", "module": "salesforce", "level": "header", "title": "Order (an agreement to provide products or services; may come from an opportunity or a quote and sit under a contract)", "key": ["ID"], "unique_keys": [["ORDER_NUMBER"]], "amounts": [{"column": "TOTAL_AMOUNT", "level": "header", "currency": "CURRENCY_ISO_CODE when the org has multi-currency enabled; otherwise the org's corporate currency, and there is no currency column"}], "area": "sales", "note": "TOTAL_AMOUNT is the net total of the order's products (ORDERITEM): joined with its lines it is repeated once per line. ORDER_NUMBER is an auto-number, not the id. STATUS is Draft or Activated; only a draft can be deleted. ORIGINAL_ORDER_ID marks a reduction order against an earlier order.", "sources": ["sf_obj_order", "sf_fields_order"]}
  - {"name": "ORDERITEM", "module": "salesforce", "level": "item", "title": "Order product (a line of an order)", "key": ["ID"], "amounts": [{"column": "TOTAL_PRICE", "level": "item", "currency": "the order's currency"}], "area": "sales", "note": "ORDER_ID is required and cannot be updated. As on an opportunity line, the product comes through PRICEBOOK_ENTRY_ID; PRODUCT2_ID cannot be updated after insert. QUOTE_LINE_ITEM_ID names the quote line it came from. The page says TOTAL_PRICE is calculated differently when Commerce Orders are enabled.", "sources": ["sf_obj_orderitem", "sf_fields_orderitem"]}
  - {"name": "PRICEBOOK2", "module": "salesforce", "level": "master", "title": "Price book (a list of products and their prices)", "key": ["ID"], "area": "product catalog", "note": "Every org has one standard price book (IS_STANDARD); the others are custom. Deleting a price book that line items still reference archives it: the lines are unaffected but the price book is no longer available from the API, so it can be missing from a landing while lines point at its entries.", "sources": ["sf_obj_pricebook2", "sf_fields_pricebook2"]}
  - {"name": "PRICEBOOKENTRY", "module": "salesforce", "level": "master", "title": "Price book entry (a product's price in one price book and currency)", "key": ["ID"], "area": "product catalog", "note": "PRICEBOOK2_ID and PRODUCT2_ID are both required. UNIT_PRICE is the list price, not an amount; with USE_STANDARD_PRICE it is the standard price book's.", "sources": ["sf_obj_pricebookentry", "sf_fields_pricebookentry"]}
  - {"name": "PRODUCT2", "module": "salesforce", "level": "master", "title": "Product (the product catalog)", "key": ["ID"], "area": "product catalog", "note": "PRODUCT_CODE is free text and not declared unique. A product has a price only through PRICEBOOKENTRY, one per price book and (in a multi-currency org) currency. QUANTITY_UNIT_OF_MEASURE is the unit of the lines' QUANTITY.", "sources": ["sf_obj_product2", "sf_fields_product2"]}
  - {"name": "QUOTE", "module": "salesforce", "level": "header", "title": "Quote (proposed prices of products for a customer, under an opportunity)", "key": ["ID"], "amounts": [{"column": "TOTAL_PRICE", "level": "header", "currency": "CURRENCY_ISO_CODE when the org has multi-currency enabled; otherwise the org's corporate currency, and there is no currency column"}, {"column": "GRAND_TOTAL", "level": "header", "currency": "CURRENCY_ISO_CODE when the org has multi-currency enabled; otherwise the org's corporate currency, and there is no currency column"}], "area": "sales", "note": "OPPORTUNITY_ID is a master-detail relationship on the page: every quote belongs to one opportunity. TOTAL_PRICE is the total of the quote's line items after discounts and before tax and shipping; GRAND_TOTAL adds shipping and tax; SUBTOTAL is before discounts. The same column name TOTAL_PRICE is a header total here and a line total on QUOTELINEITEM. One quote of an opportunity can be syncing with it (IS_SYNCING; OPPORTUNITY.SYNCED_QUOTE_ID). ACCOUNT_ID is read-only. QUOTE_NUMBER is system-generated.", "sources": ["sf_obj_quote", "sf_fields_quote"]}
  - {"name": "QUOTELINEITEM", "module": "salesforce", "level": "item", "title": "Quote line item (a line of a quote)", "key": ["ID"], "amounts": [{"column": "TOTAL_PRICE", "level": "item", "currency": "the quote's currency"}], "area": "sales", "note": "QUOTE_ID is a master-detail relationship on the page, required and not updatable. TOTAL_PRICE is read-only: SUBTOTAL (QUANTITY times UNIT_PRICE) after the discount. OPPORTUNITY_LINE_ITEM_ID names the opportunity line the quote line mirrors when the quote syncs; it is filled by the API and not editable.", "sources": ["sf_obj_quotelineitem", "sf_fields_quotelineitem"]}
  - {"name": "TASK", "module": "salesforce", "level": "document_flow", "title": "Task (a to-do or a logged call or e-mail, about a person and a record)", "key": ["ID"], "area": "activities", "note": "WHO_ID is polymorphic: a contact or a lead. WHAT_ID is polymorphic: an account, opportunity, case, campaign, contract, order, quote, asset, product or any of some 1 500 other objects the page lists. ACCOUNT_ID is derived and read-only. OWNER_ID is the assigned user. Recurring tasks have a main record and occurrences (RECURRENCE_ACTIVITY_ID).", "sources": ["sf_obj_task", "sf_fields_task"]}
  - {"name": "USER", "module": "salesforce", "level": "organization", "title": "User (a person who signs in to the org: owners, sales representatives, case agents)", "key": ["ID"], "unique_keys": [["USERNAME"]], "area": "users", "note": "Every OWNER_ID that names a person points here. MANAGER_ID names another user. USERNAME is the sign-in name, in the form of an e-mail address and unique across all orgs. Users cannot be deleted, only deactivated (IS_ACTIVE false), so former users stay in the table and keep the records they own. Personal data of employees.", "sources": ["sf_obj_user", "sf_fields_user"]}
