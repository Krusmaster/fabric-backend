traps:
  - {"name": "sf_rollup_amounts", "title": "Opportunity.Amount, Order.TotalAmount and Quote.TotalPrice are totals of their lines", "description": "Every opportunity line item adds its TOTAL_PRICE to OPPORTUNITY.AMOUNT, and AMOUNT is read-only once the opportunity has line items; ORDER.TOTAL_AMOUNT is the net total of the order's products; QUOTE.TOTAL_PRICE the total of the quote's line items after discounts. A header amount summed over a join with its lines counts once per line (the total that doubles). On Quote and QuoteLineItem the same name TOTAL_PRICE is a header total and a line total. UNIT_PRICE and LIST_PRICE are prices, not amounts.", "module": "salesforce", "sources": ["sf_obj_opportunitylineitem", "sf_obj_order", "sf_obj_quote", "sf_obj_quotelineitem"], "check": "amount_level"}
  - {"name": "sf_product_through_price_book", "title": "The product is reached through the price book entry", "description": "A line (opportunity, order or quote) names a PricebookEntry, which names the Product2 and the Pricebook2. PRODUCT2_ID on an opportunity line is a read-only copy of the entry's product; read one of them as the link, not both as independent facts. A price book deleted while lines still reference it is archived and no longer available from the API: its entries' PRICEBOOK2_ID can point at nothing in a landing.", "module": "salesforce", "sources": ["sf_obj_opportunitylineitem", "sf_obj_pricebook2", "sf_obj_pricebookentry"], "check": "referential_integrity"}
  - {"name": "sf_multi_currency", "title": "A currency column exists only in a multi-currency org", "description": "CURRENCY_ISO_CODE is present only when multi-currency is enabled; a line item's currency is always its opportunity's. Without it every amount is in the org's corporate currency and there is no column to read. A sum over opportunities of several currencies without a conversion adds currencies.", "module": "salesforce", "sources": ["sf_obj_opportunitylineitem", "sf_fields_opportunity"], "check": "manual"}
  - {"name": "sf_id_length", "title": "Salesforce ids: 15 characters in the user interface, 18 through the API", "description": "The API returns 18-character, case-safe ids; the user interface and many reports show the 15-character, case-sensitive form, which is the 18-character id without its last three characters. A key pasted or exported in 15 characters finds nothing in a table loaded through the API, and a 15-character id compared without case can match the wrong record. Compare on 18 characters, or on the first 15 compared with case.", "module": "salesforce", "sources": ["sf_id_field_type"], "check": "manual"}
  - {"name": "sf_polymorphic_who_what", "title": "Task and Event point at different tables from one column", "description": "WHO_ID is a contact or a lead; WHAT_ID one of some 1 500 object types (an account, an opportunity, a case, ...). A join of WHAT_ID to OPPORTUNITY finds only the activities about opportunities, and the others look like orphans. Split by the id's three-character object prefix (the describeSObjects key prefix of each object) before joining, or use ACCOUNT_ID, which the activity carries already. The pack lists these links and applies none of them.", "module": "salesforce", "sources": ["sf_obj_task", "sf_obj_event", "sf_id_field_type"], "check": "manual"}
  - {"name": "sf_lead_conversion", "title": "A converted lead stays in the Lead table", "description": "Converting a lead creates (or matches) an account, a contact and possibly an opportunity, sets IS_CONVERTED and the CONVERTED_* ids, and leaves the lead read-only in the table. Counting leads and contacts together counts a converted person twice; a funnel counts leads, then IS_CONVERTED, then the converted opportunities (CONVERTED_OPPORTUNITY_ID) and their IS_WON.", "module": "salesforce", "sources": ["sf_obj_lead"], "check": "manual"}
  - {"name": "sf_campaign_rollups", "title": "Campaign amounts are sums over its opportunities", "description": "CAMPAIGN.AMOUNT_ALL_OPPORTUNITIES and AMOUNT_WON_OPPORTUNITIES are read-only sums Salesforce keeps over the campaign's opportunities. Adding them to the opportunities' AMOUNT counts the deals twice, and joined with members or opportunities they repeat once per row. An opportunity counts for one campaign (its CAMPAIGN_ID, the primary campaign source) even when its contacts were members of several.", "module": "salesforce", "sources": ["sf_obj_campaign", "sf_obj_opportunity"], "check": "amount_level"}
  - {"name": "sf_quote_sync", "title": "A syncing quote mirrors the opportunity's lines", "description": "One quote of an opportunity can sync with it (QUOTE.IS_SYNCING, OPPORTUNITY.SYNCED_QUOTE_ID); its lines then mirror the opportunity's line items (QUOTELINEITEM.OPPORTUNITY_LINE_ITEM_ID). Summing quote lines and opportunity lines together counts the same deal twice, and summing all quotes of an opportunity counts every version of the offer.", "module": "salesforce", "sources": ["sf_obj_quote", "sf_obj_quotelineitem", "sf_obj_opportunity"], "check": "manual"}
  - {"name": "sf_contact_roles", "title": "Opportunity contacts are a link table", "description": "OPPORTUNITYCONTACTROLE links opportunities and contacts many-to-many, with a ROLE and one primary contact per opportunity. An opportunity amount summed through it counts once per contact; filter IS_PRIMARY or count distinct opportunities. OPPORTUNITY.CONTACT_ID is set on create only and does not follow the roles.", "module": "salesforce", "sources": ["sf_obj_opportunitycontactrole", "sf_obj_opportunity"], "check": "amount_level"}
  - {"name": "sf_deleted_rows", "title": "Deleted records can land too", "description": "Fabric's Salesforce copy can include deleted records (the copy activity's 'Include deleted objects'); they carry IS_DELETED = true. A landing made with that option counts deleted opportunities, cases and lines unless IS_DELETED is filtered. Opportunity line items deleted directly skip the recycle bin; the API reports them as deleted only until they are purged.", "module": "salesforce", "sources": ["ms_sf_copy_activity", "sf_obj_opportunitylineitem"], "check": "manual"}
  - {"name": "sf_owner_queue", "title": "An owner is not always a user", "description": "OWNER_ID holds the owning user's id on most objects; leads and cases can be owned by a queue, whose id is in no USER row. The pack applies OWNER_ID -> USER where the owner is a user and lists it, not applied, for Lead, Case, Task and Event.", "module": "salesforce", "sources": ["sf_id_field_type", "sf_queue_owner"], "check": "manual"}
  - {"name": "sf_landing_names", "title": "How Salesforce lands in Fabric: object and field API names, unless someone renamed them", "description": "Microsoft Learn lists no Salesforce source for Fabric database mirroring (17 November 2026; third-party tools offer open mirroring); the data usually arrives through Data Factory's Salesforce objects connector (Copy job, a pipeline's copy activity reading an object by its API name or a SOQL query, or Dataflow Gen2). A Copy job keeps the source's table and column names and types unless mapped; Dataflow Gen2 names a table after its query and adjusts unsupported characters. So a landing usually reads Account, OpportunityLineItem and AccountId, but a mapping, a prefix (sf_) or a lower-case convention is the integrator's choice; the pack compares names without case and underscores and reads past an sf_ or salesforce_ prefix. ORDER, CASE and USER are reserved words in SQL and need brackets. Custom fields (__c) and custom objects are not described.", "module": "salesforce", "sources": ["ms_sf_objects_connector", "ms_sf_copy_activity", "ms_copy_job_create", "ms_dataflow_destinations", "ms_pq_salesforce_objects", "ms_mirroring_overview", "ms_open_mirroring_partners"], "check": "manual"}
  - {"name": "sf_person_accounts", "title": "An account can be a person", "description": "With person accounts enabled, an ACCOUNT row with IS_PERSON_ACCOUNT true is a person, and its name and the person fields carried from its contact are personal data. A count of accounts as companies then includes people.", "module": "salesforce", "sources": ["sf_obj_account"], "check": "privacy"}
