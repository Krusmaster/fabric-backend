  - {"id": "export_lake_faq", "title": "Azure Synapse Link for Dataverse: frequently asked questions", "url": "https://learn.microsoft.com/en-us/power-apps/maker/data-platform/export-data-lake-faq", "publisher": "Microsoft Learn", "accessed": "2026-11-17", "verified": true, "note": "Read 17 November 2026; ms.date 2026-11-06. Deletes: appended row with isDeleted=True (append-only) or a soft delete and a hard delete after 30 days (Delta; the finance and operations page says 28); latest row by id with VersionNumber and SinkModifiedOn, then isDeleted=0; lookup columns are an id and a value: join to the table itself."}
  - {"id": "fabric_link", "title": "Link your Dataverse environment to Microsoft Fabric (Link to Microsoft Fabric)", "url": "https://learn.microsoft.com/en-us/power-apps/maker/data-platform/azure-synapse-link-view-in-fabric", "publisher": "Microsoft Learn", "accessed": "2026-11-17", "verified": true, "note": "Read 17 November 2026; ms.date 2026-07-06. Delta parquet replica in Dataverse storage, a lakehouse with shortcuts to the tables; all non-system tables with Track changes enabled are added; finance and operations tables can be linked too. The page does not say how lookup columns are named in the lakehouse."}
  - {"id": "fabric_link_platform", "title": "Link to Microsoft Fabric: how it works (latency, lakehouse naming, low-latency sync)", "url": "https://learn.microsoft.com/en-us/power-apps/maker/data-platform/fabric-link-to-data-platform", "publisher": "Microsoft Learn", "accessed": "2026-11-17", "verified": true, "note": "Read 17 November 2026; ms.date 2026-11-11. Up to 60 minutes to update OneLake; the lakehouse name pattern is not to be relied on; low-latency sync writes timestamps as INT64."}
  - {"id": "multitable_lookup", "title": "Dataverse Web API: multi-table lookups (polymorphic lookups; Customer connects to account and contact)", "url": "https://learn.microsoft.com/en-us/power-apps/developer/data-platform/webapi/multitable-lookup", "publisher": "Microsoft Learn", "accessed": "2026-11-17", "verified": true, "note": "Read 17 November 2026; ms.date 2026-10-27. _<name>_value alone does not say which table the id belongs to (select-columns page, ms.date 2026-10-28: an annotation does)."}
  - {"id": "synapse_link_columns", "title": "Azure Synapse Link: choose finance and operations data (the table of system columns: Id, IsDelete, SinkCreatedOn, SinkModifiedOn, versionnumber, sysrowversion)", "url": "https://learn.microsoft.com/en-us/power-apps/maker/data-platform/azure-synapse-link-select-fno-data", "publisher": "Microsoft Learn", "accessed": "2026-11-17", "verified": true, "note": "Read 17 November 2026; ms.date 2026-11-03. IsDelete true marks a soft-deleted row whose body is empty; SinkCreatedOn is when the row was written to the lake; versionnumber the last version synced. The page's sentence on reading active rows says to filter where isDelete is True, which reads as reversed; the FAQ (export_lake_faq) says isDeleted=0."}
  - {"id": "webapi_properties", "title": "Dataverse Web API: properties (lookup properties named _<name>_value)", "url": "https://learn.microsoft.com/en-us/power-apps/developer/data-platform/webapi/web-api-properties", "publisher": "Microsoft Learn", "accessed": "2026-11-17", "verified": true, "note": "Read 17 November 2026; ms.date 2022-04-06. Lookup properties follow _<name>_value: computed, read-only, an Edm.Guid."}
entities:
  - {"name": "COUNTRY_REGION", "module": "business_central", "level": "master", "title": "Country/Region (9)", "key": ["COMPANY", "CODE"], "variants": ["bc_sql", "bc2adls"], "area": "organisation", "note": "Key Code.", "sources": ["bc_country_region", "bcapps_source"]}
  - {"name": "CUSTOMER", "module": "business_central", "level": "master", "title": "Customer (18)", "key": ["COMPANY", "NO"], "variants": ["bc_sql", "bc2adls"], "area": "customer 360", "note": "Key No.; SALESPERSON_CODE, COUNTRY_REGION_CODE and CURRENCY_CODE relate to their tables. Balance, Balance (LCY) and Sales (LCY) are FlowFields: not in the database, not in an export.", "sources": ["bc_customer", "bcapps_source"]}
  - {"name": "CUST_LEDGER_ENTRY", "module": "business_central", "level": "header", "title": "Cust. Ledger Entry (21)", "key": ["COMPANY", "ENTRY_NO"], "amounts": [{"column": "SALES_LCY", "level": "header", "currency": "local currency (LCY)"}], "variants": ["bc_sql", "bc2adls"], "area": "order to cash", "note": "Key Entry No. Amount, Remaining Amount, Original Amount and their LCY forms are FlowFields summed from Detailed Cust. Ledg. Entry: an export has none of them. SALES_LCY is stored.", "sources": ["bc_cust_ledger_entry", "bcapps_source", "bc_flowfields"]}
  - {"name": "DETAILED_CUST_LEDG_ENTRY", "module": "business_central", "level": "item", "title": "Detailed Cust. Ledg. Entry (379)", "key": ["COMPANY", "ENTRY_NO"], "amounts": [{"column": "AMOUNT", "level": "item", "currency": "CURRENCY_CODE (blank: LCY)"}, {"column": "AMOUNT_LCY", "level": "item", "currency": "local currency (LCY)"}], "variants": ["bc_sql", "bc2adls"], "area": "order to cash", "note": "Key Entry No.; CUST_LEDGER_ENTRY_NO is the customer ledger entry it details; ENTRY_TYPE the kind (initial entry, application, ...). AMOUNT and AMOUNT_LCY are stored: the customer ledger's amounts are sums of these rows (initial entries for the original amount, all rows for the remaining).", "sources": ["bc_detailed_cust_ledg_entry", "bcapps_source"]}
  - {"name": "DIMENSION_SET_ENTRY", "module": "business_central", "level": "master", "title": "Dimension Set Entry (480)", "key": ["COMPANY", "DIMENSION_SET_ID", "DIMENSION_CODE"], "variants": ["bc_sql", "bc2adls"], "area": "finance", "note": "Key Dimension Set ID + Dimension Code: one row per dimension in a set. A ledger entry's DIMENSION_SET_ID matches several rows, one per dimension.", "sources": ["bc_dimension_set_entry", "bcapps_source"]}
  - {"name": "G_L_ENTRY", "module": "business_central", "level": "item", "title": "G/L Entry (17)", "key": ["COMPANY", "ENTRY_NO"], "amounts": [{"column": "AMOUNT", "level": "item", "currency": "local currency (LCY); the entry has no currency column for it"}], "variants": ["bc_sql", "bc2adls"], "area": "finance", "note": "Key Entry No. AMOUNT is in local currency (LCY), debit positive and credit negative; DEBIT_AMOUNT and CREDIT_AMOUNT split it. SOURCE_TYPE and SOURCE_NO name a customer, vendor, bank account or fixed asset. DIMENSION_SET_ID points at a set of dimension values.", "sources": ["bc_g_l_entry", "bcapps_source"]}
  - {"name": "ITEM", "module": "business_central", "level": "master", "title": "Item (27)", "key": ["COMPANY", "NO"], "variants": ["bc_sql", "bc2adls"], "area": "product catalog", "note": "Key No.; UNIT_PRICE is a price. Inventory and Sales (LCY) are FlowFields (sums of Item Ledger Entry and Value Entry).", "sources": ["bc_item", "bcapps_source"]}
  - {"name": "ITEM_LEDGER_ENTRY", "module": "business_central", "level": "header", "title": "Item Ledger Entry (32)", "key": ["COMPANY", "ENTRY_NO"], "variants": ["bc_sql", "bc2adls"], "area": "inventory", "note": "Key Entry No.; ITEM_NO the item; QUANTITY stored. The cost and sales amounts on it are FlowFields over Value Entry.", "sources": ["bc_item_ledger_entry", "bcapps_source", "bc_flowfields"]}
  - {"name": "PURCHASE_HEADER", "module": "business_central", "level": "header", "title": "Purchase Header (38)", "key": ["COMPANY", "DOCUMENT_TYPE", "NO"], "variants": ["bc_sql", "bc2adls"], "area": "procure to pay", "note": "Key Document Type + No. (as Sales Header). Amount and Amount Including VAT are FlowFields over the lines.", "sources": ["bc_purchase_header", "bcapps_source", "bc_flowfields"]}
  - {"name": "PURCHASE_LINE", "module": "business_central", "level": "item", "title": "Purchase Line (39)", "key": ["COMPANY", "DOCUMENT_TYPE", "DOCUMENT_NO", "LINE_NO"], "amounts": [{"column": "AMOUNT", "level": "item", "currency": "CURRENCY_CODE (blank: the company's local currency, LCY)"}, {"column": "AMOUNT_INCLUDING_VAT", "level": "item", "currency": "CURRENCY_CODE (blank: the company's local currency, LCY)"}, {"column": "LINE_AMOUNT", "level": "item", "currency": "CURRENCY_CODE (blank: the company's local currency, LCY)"}], "variants": ["bc_sql", "bc2adls"], "area": "procure to pay", "note": "Key Document Type + Document No. + Line No.; TYPE and No. as on Sales Line.", "sources": ["bc_purchase_line", "bcapps_source"]}
  - {"name": "SALESPERSON_PURCHASER", "module": "business_central", "level": "organization", "title": "Salesperson/Purchaser (13)", "key": ["COMPANY", "CODE"], "variants": ["bc_sql", "bc2adls"], "area": "organisation", "note": "Key Code. One table for salespeople and purchasers.", "sources": ["bc_salesperson_purchaser", "bcapps_source"]}
  - {"name": "SALES_HEADER", "module": "business_central", "level": "header", "title": "Sales Header (36): open quotes, orders, invoices, credit memos, blanket and return orders", "key": ["COMPANY", "DOCUMENT_TYPE", "NO"], "variants": ["bc_sql", "bc2adls"], "area": "order to cash", "note": "Key Document Type + No.: one table for every kind of open sales document (DOCUMENT_TYPE 0 Quote, 1 Order, 2 Invoice, 3 Credit Memo, 4 Blanket Order, 5 Return Order); the same No. can exist under two types. Amount and Amount Including VAT are FlowFields over the lines: not stored, not exported. A posted document leaves this table (Sales Invoice Header).", "sources": ["bc_sales_header", "bcapps_source", "bc_flowfields"]}
  - {"name": "SALES_INVOICE_HEADER", "module": "business_central", "level": "header", "title": "Sales Invoice Header (112): posted sales invoices", "key": ["COMPANY", "NO"], "variants": ["bc_sql", "bc2adls"], "area": "order to cash", "note": "Key No. ORDER_NO is the order it was posted from (no table relation; the order is usually deleted once fully invoiced). Amount and Amount Including VAT are FlowFields over the lines.", "sources": ["bc_sales_invoice_header", "bcapps_source", "bc_flowfields"]}
  - {"name": "SALES_INVOICE_LINE", "module": "business_central", "level": "item", "title": "Sales Invoice Line (113)", "key": ["COMPANY", "DOCUMENT_NO", "LINE_NO"], "amounts": [{"column": "AMOUNT", "level": "item", "currency": "CURRENCY_CODE (blank: the company's local currency, LCY)"}, {"column": "AMOUNT_INCLUDING_VAT", "level": "item", "currency": "CURRENCY_CODE (blank: the company's local currency, LCY)"}, {"column": "LINE_AMOUNT", "level": "item", "currency": "CURRENCY_CODE (blank: the company's local currency, LCY)"}], "variants": ["bc_sql", "bc2adls"], "area": "order to cash", "note": "Key Document No. + Line No.; TYPE and No. as on Sales Line. AMOUNT, AMOUNT_INCLUDING_VAT and LINE_AMOUNT are stored.", "sources": ["bc_sales_invoice_line", "bcapps_source"]}
  - {"name": "SALES_LINE", "module": "business_central", "level": "item", "title": "Sales Line (37)", "key": ["COMPANY", "DOCUMENT_TYPE", "DOCUMENT_NO", "LINE_NO"], "amounts": [{"column": "AMOUNT", "level": "item", "currency": "CURRENCY_CODE (blank: the company's local currency, LCY)"}, {"column": "AMOUNT_INCLUDING_VAT", "level": "item", "currency": "CURRENCY_CODE (blank: the company's local currency, LCY)"}, {"column": "LINE_AMOUNT", "level": "item", "currency": "CURRENCY_CODE (blank: the company's local currency, LCY)"}], "variants": ["bc_sql", "bc2adls"], "area": "order to cash", "note": "Key Document Type + Document No. + Line No. TYPE says what No. is (0 blank/text, 1 G/L Account, 2 Item, 3 Resource, 4 Fixed Asset, 5 Charge (Item), 10 Allocation Account): No. is an item only when TYPE is Item. AMOUNT (excluding VAT, after invoice discount), AMOUNT_INCLUDING_VAT and LINE_AMOUNT (before invoice discount) are stored.", "sources": ["bc_sales_line", "bcapps_source"]}
  - {"name": "VALUE_ENTRY", "module": "business_central", "level": "item", "title": "Value Entry (5802)", "key": ["COMPANY", "ENTRY_NO"], "amounts": [{"column": "SALES_AMOUNT_ACTUAL", "level": "item", "currency": "local currency (LCY)"}, {"column": "COST_AMOUNT_ACTUAL", "level": "item", "currency": "local currency (LCY)"}], "variants": ["bc_sql", "bc2adls"], "area": "inventory", "note": "Key Entry No.; ITEM_LEDGER_ENTRY_NO the item ledger entry it values. SALES_AMOUNT_ACTUAL and COST_AMOUNT_ACTUAL are stored, in LCY.", "sources": ["bc_value_entry", "bcapps_source"]}
  - {"name": "VENDOR", "module": "business_central", "level": "master", "title": "Vendor (23)", "key": ["COMPANY", "NO"], "variants": ["bc_sql", "bc2adls"], "area": "procure to pay", "note": "Key No.; PURCHASER_CODE (not Salesperson Code) relates to Salesperson/Purchaser. Balance is a FlowField.", "sources": ["bc_vendor", "bcapps_source"]}
  - {"name": "ACCOUNT", "module": "dataverse", "level": "master", "title": "Account (a company the organisation does business with)", "key": ["ACCOUNTID"], "variants": ["fabric_link", "web_api"], "area": "customer 360", "note": "Key ACCOUNTID (a GUID); name column NAME. PARENTACCOUNTID is the parent account, PRIMARYCONTACTID the primary contact. In the lakehouse that Link to Microsoft Fabric creates, the table carries the system columns of Azure Synapse Link (Id, IsDelete, SinkCreatedOn, SinkModifiedOn, versionnumber); read only rows where IsDelete is not true.", "sources": ["dv_account", "synapse_link_columns"]}
  - {"name": "ACTIVITYPOINTER", "module": "dataverse", "level": "header", "title": "Activity (the shared table of e-mails, phone calls, tasks, appointments)", "key": ["ACTIVITYID"], "variants": ["fabric_link", "web_api"], "area": "customer 360", "note": "Key ACTIVITYID (not activitypointerid). ACTIVITYTYPECODE says which kind of activity. REGARDINGOBJECTID is a multi-table lookup: the record the activity is about, with REGARDINGOBJECTTYPECODE naming its table (account, contact, opportunity, lead, incident, quote, salesorder, invoice and others).", "sources": ["dv_activitypointer", "dv_opportunity"]}
  - {"name": "BUSINESSUNIT", "module": "dataverse", "level": "organization", "title": "Business unit", "key": ["BUSINESSUNITID"], "variants": ["fabric_link", "web_api"], "area": "organisation", "note": "Key BUSINESSUNITID; PARENTBUSINESSUNITID the parent unit.", "sources": ["dv_businessunit"]}
  - {"name": "CONTACT", "module": "dataverse", "level": "partner", "title": "Contact (a person)", "key": ["CONTACTID"], "variants": ["fabric_link", "web_api"], "area": "customer 360", "note": "Key CONTACTID; name column FULLNAME. PARENTCUSTOMERID is a Customer lookup: an account or a contact, with PARENTCUSTOMERIDTYPE saying which. Personal data throughout.", "sources": ["dv_contact"]}
  - {"name": "INCIDENT", "module": "dataverse", "level": "header", "title": "Case (a customer service issue)", "key": ["INCIDENTID"], "variants": ["fabric_link", "web_api"], "area": "service cases", "note": "Key INCIDENTID; name column TITLE. CUSTOMERID is a Customer lookup (account or contact); PRIMARYCONTACTID a contact; PARENTCASEID a parent case.", "sources": ["dv_incident"]}
  - {"name": "INVOICE", "module": "dataverse", "level": "header", "title": "Invoice", "key": ["INVOICEID"], "amounts": [{"column": "TOTALAMOUNT", "level": "header", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}], "variants": ["fabric_link", "web_api"], "area": "order to cash", "note": "Key INVOICEID. TOTALAMOUNT is the sum of the products, discount, freight and taxes. SALESORDERID is the order it bills.", "sources": ["dv_invoice"]}
  - {"name": "INVOICEDETAIL", "module": "dataverse", "level": "item", "title": "Invoice product (a line of an invoice)", "key": ["INVOICEDETAILID"], "amounts": [{"column": "EXTENDEDAMOUNT", "level": "item", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}], "variants": ["fabric_link", "web_api"], "area": "order to cash", "note": "Key INVOICEDETAILID. EXTENDEDAMOUNT is the line's amount. SALESORDERDETAILID is the order line it bills.", "sources": ["dv_invoicedetail"]}
  - {"name": "LEAD", "module": "dataverse", "level": "header", "title": "Lead (a prospect not yet qualified)", "key": ["LEADID"], "amounts": [{"column": "ESTIMATEDAMOUNT", "level": "header", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}], "variants": ["fabric_link", "web_api"], "area": "lead to cash", "note": "Key LEADID; name column FULLNAME. Qualifying a lead creates an opportunity: QUALIFYINGOPPORTUNITYID on the lead, ORIGINATINGLEADID on the opportunity. CUSTOMERID is a Customer lookup (account or contact).", "sources": ["dv_lead"]}
  - {"name": "OPPORTUNITY", "module": "dataverse", "level": "header", "title": "Opportunity (a potential sale)", "key": ["OPPORTUNITYID"], "amounts": [{"column": "ESTIMATEDVALUE", "level": "header", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}, {"column": "ACTUALVALUE", "level": "header", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}, {"column": "TOTALAMOUNT", "level": "header", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}], "variants": ["fabric_link", "web_api"], "area": "lead to cash", "note": "Key OPPORTUNITYID. ESTIMATEDVALUE is the forecast revenue (entered by hand or computed from the products, as the Revenue field says); ACTUALVALUE defaults to it when the opportunity is won; TOTALAMOUNT is the sum of the products, discounts, freight and taxes. CUSTOMERID is a Customer lookup; the reference says to use PARENTACCOUNTID and PARENTCONTACTID rather than the internal ACCOUNTID and CONTACTID.", "sources": ["dv_opportunity"]}
  - {"name": "OPPORTUNITYPRODUCT", "module": "dataverse", "level": "item", "title": "Opportunity product (a line of an opportunity)", "key": ["OPPORTUNITYPRODUCTID"], "amounts": [{"column": "EXTENDEDAMOUNT", "level": "item", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}, {"column": "BASEAMOUNT", "level": "item", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}], "variants": ["fabric_link", "web_api"], "area": "lead to cash", "note": "Key OPPORTUNITYPRODUCTID. PRICEPERUNIT is a price; BASEAMOUNT is price per unit times quantity after volume discount; EXTENDEDAMOUNT is that minus the manual discount (and with tax): the line's amount. A write-in product has no PRODUCTID.", "sources": ["dv_opportunityproduct"]}
  - {"name": "PRICELEVEL", "module": "dataverse", "level": "master", "title": "Price list", "key": ["PRICELEVELID"], "variants": ["fabric_link", "web_api"], "area": "product catalog", "note": "Key PRICELEVELID; one currency per price list (TRANSACTIONCURRENCYID).", "sources": ["dv_pricelevel"]}
  - {"name": "PRODUCT", "module": "dataverse", "level": "master", "title": "Product", "key": ["PRODUCTID"], "variants": ["fabric_link", "web_api"], "area": "product catalog", "note": "Key PRODUCTID; organisation-owned (no owner). PRICE, CURRENTCOST and STANDARDCOST are prices, not amounts. PRICELEVELID is the default price list.", "sources": ["dv_product"]}
  - {"name": "PRODUCTPRICELEVEL", "module": "dataverse", "level": "master", "title": "Price list item (a product's price in one price list)", "key": ["PRODUCTPRICELEVELID"], "variants": ["fabric_link", "web_api"], "area": "product catalog", "note": "Key PRODUCTPRICELEVELID. AMOUNT is a list price, not a sales amount.", "sources": ["dv_productpricelevel"]}
  - {"name": "QUOTE", "module": "dataverse", "level": "header", "title": "Quote (a formal offer)", "key": ["QUOTEID"], "amounts": [{"column": "TOTALAMOUNT", "level": "header", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}], "variants": ["fabric_link", "web_api"], "area": "lead to cash", "note": "Key QUOTEID. TOTALAMOUNT is the sum of the products, discounts, freight and taxes. OPPORTUNITYID is the opportunity it was made for.", "sources": ["dv_quote"]}
  - {"name": "QUOTEDETAIL", "module": "dataverse", "level": "item", "title": "Quote product (a line of a quote)", "key": ["QUOTEDETAILID"], "amounts": [{"column": "EXTENDEDAMOUNT", "level": "item", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}, {"column": "BASEAMOUNT", "level": "item", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}], "variants": ["fabric_link", "web_api"], "area": "lead to cash", "note": "Key QUOTEDETAILID. EXTENDEDAMOUNT is the line's amount.", "sources": ["dv_quotedetail"]}
  - {"name": "SALESORDER", "module": "dataverse", "level": "header", "title": "Order (a confirmed sale)", "key": ["SALESORDERID"], "amounts": [{"column": "TOTALAMOUNT", "level": "header", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}, {"column": "TOTALLINEITEMAMOUNT", "level": "header", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}, {"column": "TOTALTAX", "level": "header", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}], "variants": ["fabric_link", "web_api"], "area": "order to cash", "note": "Key SALESORDERID. TOTALAMOUNT is the total due (products, discounts, freight and taxes); TOTALLINEITEMAMOUNT the sum of the products. QUOTEID and OPPORTUNITYID name where the order came from. CUSTOMERID is a Customer lookup.", "sources": ["dv_salesorder"]}
  - {"name": "SALESORDERDETAIL", "module": "dataverse", "level": "item", "title": "Order product (a line of an order)", "key": ["SALESORDERDETAILID"], "amounts": [{"column": "EXTENDEDAMOUNT", "level": "item", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}, {"column": "BASEAMOUNT", "level": "item", "currency": "TRANSACTIONCURRENCYID (a lookup to transactioncurrency); each money column has a _BASE twin in the organisation's base currency, converted with EXCHANGERATE"}], "variants": ["fabric_link", "web_api"], "area": "order to cash", "note": "Key SALESORDERDETAILID. EXTENDEDAMOUNT is the line's amount (unit price, quantity, discounts and tax); BASEAMOUNT before the manual discount.", "sources": ["dv_salesorderdetail"]}
  - {"name": "SYSTEMUSER", "module": "dataverse", "level": "organization", "title": "User", "key": ["SYSTEMUSERID"], "variants": ["fabric_link", "web_api"], "area": "organisation", "note": "Key SYSTEMUSERID; name column FULLNAME. BUSINESSUNITID is the user's business unit; PARENTSYSTEMUSERID the manager.", "sources": ["dv_systemuser"]}
  - {"name": "TEAM", "module": "dataverse", "level": "organization", "title": "Team (a group of users that can own records)", "key": ["TEAMID"], "variants": ["fabric_link", "web_api"], "area": "organisation", "note": "Key TEAMID.", "sources": ["dv_team"]}
  - {"name": "TRANSACTIONCURRENCY", "module": "dataverse", "level": "master", "title": "Currency", "key": ["TRANSACTIONCURRENCYID"], "variants": ["fabric_link", "web_api"], "area": "organisation", "note": "Key TRANSACTIONCURRENCYID; ISOCURRENCYCODE the ISO code; EXCHANGERATE the rate to the base currency.", "sources": ["dv_transactioncurrency"]}
candidate_relationships:
