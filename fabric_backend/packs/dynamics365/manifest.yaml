  - {"id": "choice_labels", "title": "Azure Synapse Link: access choice labels (OptionsetMetadata, GlobalOptionsetMetadata, StateMetadata, StatusMetadata, TargetMetadata)", "url": "https://learn.microsoft.com/en-us/power-apps/maker/data-platform/azure-synapse-link-choice-labels", "publisher": "Microsoft Learn", "accessed": "2026-11-17", "verified": true, "note": "Read 17 November 2026; ms.date 2022-04-27. A choice column holds the number; the label is in OptionsetMetadata (EntityName, OptionSetName, Option, LocalizedLabelLanguageCode, LocalizedLabel). TargetMetadata lists each lookup (AttributeName, e.g. transactioncurrencyid) with its ReferencedEntity: the only statement read that names a lookup column in the lake by its logical name."}
