# Knowledge pack manifest (dynamics365). Format: docs/PACKS.md; schema: packs/manifest.schema.json.
# sources, entities, candidate_relationships and traps are derived from the module files in this directory;
# regenerate them with: python -m fabric_backend.pack_manifest dynamics365 --write
# Hand-kept: id, version, title, source_systems, scope, sharing, fixtures, review_status, reviewed_by, reviewed_at, and check per trap.
id: dynamics365
version: "0.1.0"
title: "Dynamics 365: Dataverse tables of Sales and Customer Service, and Business Central base application tables, as they land in Fabric"
source_systems: ["Microsoft Dataverse (Dynamics 365 Sales, Dynamics 365 Customer Service)", "Dynamics 365 Business Central (base application)"]
scope: ["lead-to-cash", "order-to-cash", "customer-360", "service-cases", "procure-to-pay", "finance"]
sharing: public-synthetic
rule: "Dynamics 365 pack"
variants:
  bc_sql: "The per-company SQL tables <company>$<table>$<app id> (a database copy, Business Central on premises), dots as underscores."
  bc2adls: "An export with bc2adls: <Table>-<id> tables and <Field>-<id> columns, letters and digits only, with $Company."
  fabric_link: "Dataverse tables in the lakehouse Link to Microsoft Fabric (or Azure Synapse Link for Dataverse in Delta format) creates: logical names, the system columns Id, IsDelete, SinkCreatedOn, SinkModifiedOn and versionnumber."
  web_api: "Rows read through the Dataverse Web API by a pipeline: lookups as _<name>_value."
modules:
  - {"module": "business_central", "title": "Business Central base application tables: customers, vendors, items, open and posted sales documents, purchase documents, the general, customer and item ledgers and dimension sets", "status": "documented", "file": "packs/dynamics365/business_central.json"}
  - {"module": "dataverse", "title": "Dataverse tables of Dynamics 365 Sales and Customer Service: accounts, contacts, leads, opportunities, quotes, orders, invoices with their lines, products and price lists, cases, users, teams, business units, currencies and activities", "status": "documented", "file": "packs/dynamics365/dataverse.json"}
sources:
  - {"id": "bc2adls", "title": "bc2adls (microsoft/bc2adls): export of Business Central tables to a data lake", "url": "https://github.com/microsoft/bc2adls", "publisher": "Microsoft (GitHub)", "accessed": "2026-11-17", "verified": true, "note": "Read 17 November 2026 at commit b90a69ea182ef2692df23ebaad79af7e0d342e43 (6 September 2023); the README calls it an experiment that will receive no updates. Its source names a table <TableName>-<TableId> and a field <FieldName>-<FieldId> with only letters and digits (SalesHeader-36, No-3), adds a $Company column to per-company tables and refuses FlowFields."}
