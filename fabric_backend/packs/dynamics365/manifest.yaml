traps:
  - {"name": "bc_flowfield_totals", "title": "Header amounts are FlowFields: they are not in the export", "description": "Sales Header, Sales Invoice Header and Purchase Header show Amount and Amount Including VAT, and Cust. Ledger Entry shows Amount and Remaining Amount, but these are FlowFields computed from other tables when read; they are not stored, and an export of the tables (bc2adls refuses them) has no such column. Sum the lines (Sales Line, Sales Invoice Line) or Detailed Cust. Ledg. Entry. A header amount column in a landing was computed by whoever landed it: check what it sums before adding it to the lines.", "module": "business_central", "sources": ["bcapps_source", "bc_flowfields", "bc2adls"], "check": "manual"}
  - {"name": "bc_company_scope", "title": "Every table is per company", "description": "Business Central keeps data per company by default: in SQL each company has its own table (<company>$Customer$<app id>), in an export or mirror the companies' rows sit side by side with the company in a column ($Company in bc2adls). Customer C10000 can exist in every company: a key, a join or a sum without the company mixes companies. When the company is a column, keep it in every key and join; when it is in the table name, union the companies' tables with the company as a column first (the pack recognises one table per name).", "module": "business_central", "sources": ["bc_datapercompany", "bc_sql_names", "bc2adls", "bc_fabric_mirroring"], "check": "manual"}
  - {"name": "bc_document_type", "title": "Open documents of every kind share one table", "description": "Sales Header and Sales Line hold quotes, orders, invoices, credit memos, blanket and return orders, told apart by DOCUMENT_TYPE; No. is unique only within a type. A sum over Sales Line without a filter on DOCUMENT_TYPE adds quotes to orders; a credit memo's amounts are positive although they reduce revenue. Posted invoices are in Sales Invoice Header/Line, not here.", "module": "business_central", "sources": ["bcapps_source", "bc_sales_header"], "check": "manual"}
  - {"name": "bc_line_type", "title": "No. on a line is an item only when TYPE says so", "description": "Sales Line, Sales Invoice Line and Purchase Line carry TYPE and No.: the number is a G/L account, an item, a resource, a fixed asset, an item charge or an allocation account according to TYPE. Join No. to Item only for TYPE Item (2).", "module": "business_central", "sources": ["bcapps_source"], "check": "manual"}
  - {"name": "bc_ledger_double_count", "title": "One posted invoice appears in several ledgers", "description": "Posting a sales invoice writes Sales Invoice Header/Line, a Cust. Ledger Entry with its Detailed Cust. Ledg. Entries, G/L Entries for revenue, VAT and receivables, and Item and Value Entries for the items. Each is a view of the same money: revenue comes from one of them, never from their union. G/L amounts are in LCY with debit positive, so revenue is negative there.", "module": "business_central", "sources": ["bcapps_source", "bc_g_l_entry"], "check": "manual"}
  - {"name": "bc_dimension_fanout", "title": "Joining a dimension set repeats the entry", "description": "DIMENSION_SET_ID on an entry matches one Dimension Set Entry row per dimension. Join with a filter on one DIMENSION_CODE, or pivot the dimensions first.", "module": "business_central", "sources": ["bc_dimension_set_entry", "bcapps_source"], "check": "manual"}
  - {"name": "bc_landing_names", "title": "How the names arrive depends on the route", "description": "In SQL: <company>$<table>$<app id> with dots as underscores (Cust_ Ledger Entry, Document No_). In bc2adls: <Table>-<id> and <Field>-<id> with letters and digits only (CustLedgerEntry-21, DocumentNo-6) and a $Company column. Through the APIs (the Power Query connector, Dataflow Gen2): API entities such as salesOrders keyed by the SystemId GUID, not by No. The Fabric mirroring pages do not say how the mirror names tables and columns. The pack reads the SQL and bc2adls spellings; the API entities are not described here.", "module": "business_central", "sources": ["bc_sql_names", "bc2adls", "bc_api_v2", "bc_powerquery", "bc_fabric_mirroring"], "check": "manual"}
  - {"name": "dv_doubled_totals", "title": "Header totals and line amounts are the same money", "description": "OPPORTUNITY.ESTIMATEDVALUE and TOTALAMOUNT, QUOTE.TOTALAMOUNT, SALESORDER.TOTALAMOUNT and INVOICE.TOTALAMOUNT are totals of their products (with discounts, freight and tax); OPPORTUNITYPRODUCT, QUOTEDETAIL, SALESORDERDETAIL and INVOICEDETAIL.EXTENDEDAMOUNT are the lines. Summing a header total over a join with its lines counts it once per line; adding header and line amounts counts the order twice. Sum the lines, or the headers alone.", "module": "dataverse", "sources": ["dv_opportunity", "dv_opportunityproduct", "dv_salesorder", "dv_salesorderdetail", "dv_invoice", "dv_invoicedetail"], "check": "amount_level"}
  - {"name": "dv_pipeline_vs_orders", "title": "Pipeline, quotes, orders and invoices are four stages of one sale", "description": "A won opportunity becomes a quote, an order and an invoice, each with its own total (QUOTEID, OPPORTUNITYID and SALESORDERID link them). Adding ESTIMATEDVALUE of opportunities to TOTALAMOUNT of orders or invoices counts the same sale more than once; ACTUALVALUE defaults to ESTIMATEDVALUE when the opportunity is won, so it is a forecast figure until someone corrects it.", "module": "dataverse", "sources": ["dv_opportunity", "dv_quote", "dv_salesorder", "dv_invoice"], "check": "manual"}
  - {"name": "dv_soft_delete", "title": "Deleted rows stay in the lake with IsDelete", "description": "Azure Synapse Link and Link to Microsoft Fabric keep a deleted row as a soft delete (IsDelete true, an empty body) until it is purged after about 30 days (28 on one page), and append-only tables add a row per change. Filter IsDelete and, for append-only tables, keep the latest row per id by versionnumber and SinkModifiedOn before counting or summing. SinkCreatedOn is when the lake got the row, not when the record was created (CREATEDON).", "module": "dataverse", "sources": ["synapse_link_columns", "export_lake_faq"], "check": "manual"}
  - {"name": "dv_polymorphic_lookups", "title": "Customer, owner and regarding lookups point at more than one table", "description": "CUSTOMERID and PARENTCUSTOMERID hold an account or a contact, OWNERID a user or a team, REGARDINGOBJECTID any of a long list of tables. A join of the column to one table finds nothing for the rows that point at another: filter on the type column (CUSTOMERIDTYPE, PARENTCUSTOMERIDTYPE, OWNERIDTYPE, REGARDINGOBJECTTYPECODE) first. The pack lists one filtered relationship per target table; none is a plain key join.", "module": "dataverse", "sources": ["multitable_lookup", "dv_activitypointer", "dv_contact"], "check": "referential_integrity"}
  - {"name": "dv_lookup_names", "title": "A lookup has a different name in the Web API and in the lake", "description": "The Web API returns a lookup as _<name>_value (_parentaccountid_value), a computed GUID; the table reference names the column by its logical name (parentaccountid), which is also how TargetMetadata in the lake names it (AttributeName). The pack reads both spellings. That the Fabric lakehouse names every lookup column by its logical name is stated on no page read: confirm it on your tables.", "module": "dataverse", "sources": ["webapi_properties", "choice_labels"], "check": "manual"}
