traps:
  - {"name": "sf_rollup_amounts", "title": "Opportunity.Amount and Order.TotalAmount are sums of their lines", "description": "With products on the opportunity, AMOUNT is the sum of the line items' TOTAL_PRICE and read-only; ORDER.TOTAL_AMOUNT likewise over ORDERITEM. Summing a header amount over a join with its lines counts it once per line. UNIT_PRICE on a line or a price book entry is a price, not an amount.", "module": "salesforce", "sources": ["sf_opportunitylineitem", "sf_object_reference"], "check": "amount_level"}
  - {"name": "sf_product_through_price_book", "title": "The product is reached through the price book entry", "description": "A line item names a PricebookEntry, which names the Product2 and the price book. PRODUCT2_ID on the line is a derived, read-only copy of the entry's product; the two must agree, and a plan should read one of them as the link, not both as independent facts.", "module": "salesforce", "sources": ["sf_opportunitylineitem"], "check": "manual"}
  - {"name": "sf_multi_currency", "title": "A currency column exists only in a multi-currency org", "description": "CURRENCY_ISO_CODE appears on Account, Opportunity, Order and PricebookEntry only when the org has multi-currency enabled; without it every amount is in the org's corporate currency and there is no column to join with the Younium account's CURRENCY.", "module": "salesforce", "sources": ["sf_object_reference"], "check": "manual"}
  - {"name": "subscription_versions", "title": "Never sum over all versions of a subscription", "description": "Every activated change to a subscription is a new version with its own effective period; the earlier version is closed with an end date. On any date exactly one version holds. A count of seats or a sum of recurring prices over SUBSCRIPTION_VERSIONS or SUBSCRIPTION_CHARGES without a date filter counts every change again. Take the version valid on the date (EFFECTIVE_START_DATE <= date < EFFECTIVE_END_DATE, or IS_LAST_VERSION for today).", "module": "younium", "sources": ["younium_api_subscriptions"], "check": "manual"}
  - {"name": "amounts_on_lines", "title": "Amounts sit on charges and invoice lines, not on the subscription", "description": "A subscription row carries no amount. What an account pays is PRICE and QUANTITY on SUBSCRIPTION_CHARGES of a version; what it was billed is AMOUNT on INVOICE_LINES, and TOTAL_AMOUNT on INVOICES is their sum: joined with its lines the header total is repeated once per line (the check 'the total that doubles').", "module": "younium", "sources": ["younium_api_v2", "younium_api_subscriptions"], "check": "amount_level"}
  - {"name": "mrr_arr", "title": "MRR and ARR are calculated measures, not columns", "description": "Younium shows MRR, ARR and churn in its own reports; the API objects carry prices per price period, quantities and dates, not MRR. In Fabric they are measures: the recurring charges (CHARGE_TYPE Recurring) of the version valid on the date, PRICE times QUANTITY normalized to a month (MRR) or a year (ARR), in the account's currency. One-off, usage and measured charges are not recurring revenue; whether a measure includes them is a decision to write down, and the result will not equal Younium's own figure unless the definition is the same.", "module": "younium", "sources": ["younium_product_structure"], "check": "manual"}
  - {"name": "currency_per_account", "title": "One currency per account", "description": "Amounts are in the account's currency (ACCOUNTS.CURRENCY, repeated on INVOICES.CURRENCY). A sum over several accounts without a conversion adds currencies. On the Salesforce side Opportunity.Amount is in CurrencyIsoCode only when the org has multi-currency enabled; otherwise there is no currency column and the amount is in the org's corporate currency.", "module": "younium", "sources": ["younium_api_v2", "younium_sf_integration"], "check": "manual"}
  - {"name": "usage_charges", "title": "Usage and measured charges: the volume is separate", "description": "A usage or measured charge is billed on a quantity reported as usage for the period, not on a quantity agreed on the subscription; its price may be per a price period that differs from the billing period. Keep the usage volume as its own measure and do not add usage lines into recurring revenue.", "module": "younium", "sources": ["younium_product_structure"], "check": "manual"}
  - {"name": "salesforce_id_length", "title": "Salesforce ids: 15 characters in the user interface, 18 through the API", "description": "A Salesforce record id has 15 case-sensitive characters; the API and most exports give the 18-character case-safe form, whose first 15 characters are the same. ACCOUNTS.EXTERNAL_CRM_ID is filled by the connector (18 characters) but an id typed or pasted from the user interface has 15: a join finds nothing for that row, and a case-insensitive database may pair two different 15-character ids. Compare on 18 characters (CASESAFEID in Salesforce), never on the first 15 alone.", "module": "younium", "sources": ["younium_sf_integration"], "check": "referential_integrity"}
  - {"name": "two_accounts", "title": "One customer, two account rows", "description": "The same customer is a Salesforce Account (ACCOUNT, key ID) and a Younium account (ACCOUNTS, key ID, with ACCOUNT_NUMBER). Only ACCOUNTS.EXTERNAL_CRM_ID = ACCOUNT.ID binds them; a match on the name is not the link, and an account created in Younium alone has no Salesforce row. A subscription also has an invoice account that can differ from its account: bill-to and sold-to can be two rows.", "module": "younium", "sources": ["younium_sf_integration", "younium_api_subscriptions"], "check": "referential_integrity"}
  - {"name": "null_fields_omitted", "title": "Fields without a value are left out of the API's JSON", "description": "The API omits a field that has no value rather than sending null. A landing that infers its columns from the JSON of one load can lack a column (EXTERNAL_CRM_ID, EFFECTIVE_END_DATE) that the next load has: fix the column list from the reference, not from a sample.", "module": "younium", "sources": ["younium_api_v2"], "check": "manual"}
  - {"name": "draft_invoices", "title": "Draft and posted invoices", "description": "An invoice is a draft first and posted afterwards. Drafts can change and are not billed revenue; a sum over INVOICES without STATUS = posted counts them.", "module": "younium", "sources": ["younium_api_v2"], "check": "manual"}
  - {"name": "landing_names", "title": "The table names are the integrator's choice", "description": "Younium has no fixed table names in Fabric: a pipeline over the API names its tables. The pack knows the API's resource names in snake case (SUBSCRIPTION_VERSIONS for the versions array, INVOICE_LINES for invoiceLines) and reads camelCase and snake_case columns alike, and a system prefix (younium_) is read past; a landing that names them otherwise is matched by the name rules alone.", "module": "younium", "sources": ["younium_api_v2"], "check": "manual"}
