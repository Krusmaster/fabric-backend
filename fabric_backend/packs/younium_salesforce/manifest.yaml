# Knowledge pack manifest (younium_salesforce). Format: docs/PACKS.md; schema: packs/manifest.schema.json.
# sources, entities, candidate_relationships and traps are derived from the module files in this directory;
# regenerate them with: python -m fabric_backend.pack_manifest younium_salesforce --write
# Hand-kept: id, version, title, source_systems, scope, sharing, fixtures, review_status, reviewed_by, reviewed_at, and check per trap.
id: younium_salesforce
version: "0.1.0"
title: "Younium subscription billing (API v2) beside the Salesforce standard objects its connector meets"
source_systems: ["Younium (API v2)", "Salesforce (standard objects)"]
scope: ["subscription-billing", "crm-sales"]
sharing: public-synthetic
rule: "Younium + Salesforce pack"
variants:
  api_v2: "Younium API v2 objects as the public API reference describes them (api-version 2.0/2.1), landed one table per resource with nested arrays (invoiceLines, versions, charges) as tables of their own. Not verified against any tenant."
modules:
  - {"module": "salesforce", "title": "Salesforce standard objects the Younium connector meets: Account, Contact, Opportunity, OpportunityLineItem, Product2, PricebookEntry, Order, OrderItem, Contract", "status": "documented", "file": "packs/younium_salesforce/salesforce.json"}
  - {"module": "younium", "title": "Younium subscription billing (API v2): accounts, products with charge plans and charges, subscriptions with their versions and charges, sales orders, invoices with lines, payments, and the account's link to its Salesforce Account", "status": "documented", "file": "packs/younium_salesforce/younium.json"}
sources:
  - {"id": "sf_id_field_type", "title": "Salesforce: the ID field type (15-character case-sensitive ids; the 18-character case-safe form the API returns)", "url": "https://developer.salesforce.com/docs/atlas.en-us.api.meta/api/field_types.htm", "publisher": "Salesforce", "accessed": null, "verified": false, "note": "Unverified: not reachable from the writing session (1 November 2026). Web search results of that day (third-party pages pointing at this page): the user interface shows 15 case-sensitive characters, the API returns 18 whose first 15 are the same, the last three a checksum that makes the id safe where case is ignored; CASESAFEID(Id) converts."}
  - {"id": "sf_object_reference", "title": "Salesforce: Object Reference for the Salesforce Platform (standard objects and their fields)", "url": "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/", "publisher": "Salesforce", "accessed": null, "verified": false, "note": "Unverified: developer.salesforce.com could not be reached from the session that wrote this pack (1 November 2026; outside its allowed network). Written after public knowledge of the standard objects."}
  - {"id": "sf_opportunitylineitem", "title": "Salesforce Object Reference: OpportunityLineItem (OpportunityId, PricebookEntryId, Product2Id, Quantity, UnitPrice, TotalPrice)", "url": "https://developer.salesforce.com/docs/atlas.en-us.object_reference.meta/object_reference/sforce_api_objects_opportunitylineitem.htm", "publisher": "Salesforce", "accessed": null, "verified": false, "note": "Unverified: not reachable from the writing session (1 November 2026). A web search result of that day quoting the page: OpportunityId is required; pricing is set through PricebookEntryId; Product2Id is a read-only reference to the Product2 (API 30.0 and later); an opportunity has line items only when it has a Pricebook2."}
  - {"id": "younium_api_news", "title": "Younium developer portal: news and updates (release notes for API version 2.1, among them POST /Payments)", "url": "https://developer.younium.com/news-and-updates", "publisher": "Younium", "accessed": null, "verified": false, "note": "Unverified: not reachable from the writing session (1 November 2026); seen as a web search result only."}
  - {"id": "younium_api_subscriptions", "title": "Younium developer portal: API v2, Subscriptions (versions, account, invoice account, products and charges on a subscription)", "url": "https://developer.younium.com/api-s/api-2.0/subscriptions", "publisher": "Younium", "accessed": null, "verified": false, "note": "Unverified: not reachable from the writing session (1 November 2026). A web search result of that day quoting the page: GET /Subscriptions/{orderNumber}/versions; each version has a numeric version and isLastVersion; externalERPId and externalCRMId sit on the subscription, on its account and invoiceAccount objects, on each product and on each charge (with chargeNumber)."}
  - {"id": "younium_api_v2", "title": "Younium developer portal: API v2 reference (Accounts, Products with charge plans and charges, Subscriptions, Sales orders, Invoices, Payments)", "url": "https://developer.younium.com/", "publisher": "Younium", "accessed": null, "verified": false, "note": "Unverified: developer.younium.com could not be reached from the session that wrote this pack (1 November 2026; the host is outside the session's allowed network). Written after what is publicly known of the API. A web search result of the same day (not the page itself) said: the API covers accounts, products, subscriptions, invoices and payments; changing a subscription creates a new version; a product has several charge plans and a charge plan several charges; invoices are first drafts, then posted; fields without a value are left out of the JSON."}
  - {"id": "younium_product_structure", "title": "Younium support: Younium's product structure (products, charge plans, charges; charge types Recurring, One-off, Usage, Measured; price period)", "url": "https://support.younium.com/hc/en-us/articles/12275717885073-Youniums-Product-structure", "publisher": "Younium", "accessed": null, "verified": false, "note": "Unverified: not reachable from the writing session (1 November 2026). A web search result of that day quoting the article: products contain charge plans, charge plans contain charges; a charge sets the invoice description, its type, its price model, the price and the period the price applies to; charge types are Recurring, One-off, Usage and Measured; the price period matters for usage and measured charges whose billing period differs from it."}
  - {"id": "younium_sf_gen1", "title": "Younium support: the earlier (Gen 1) Salesforce connector (article 4402123737617)", "url": "https://support.younium.com/hc/en-us/articles/4402123737617", "publisher": "Younium", "accessed": null, "verified": false, "note": "Unverified: not reachable from the writing session (1 November 2026). A web search result of that day said Younium documents two generations of Salesforce connectors and that the Gen 1 account mapping covers name and shipping address without an External CRM Id; which of the two articles describes which generation could not be checked."}
  - {"id": "younium_sf_integration", "title": "Younium support: Salesforce Integration (the current connector: Accounts, Opportunities and Opportunity Products to Younium; External CRM Id from the Salesforce Account Id)", "url": "https://support.younium.com/hc/en-us/articles/29942644887954", "publisher": "Younium", "accessed": null, "verified": false, "note": "Unverified: support.younium.com could not be reached from the writing session (1 November 2026). A web search result of that day quoting the article: the connector moves Accounts, Opportunities and Opportunity Products from Salesforce to Younium; Younium's External CRM Id is populated from the Salesforce Account Id and cannot be custom mapped; the opportunity's currency maps to its currency code; opportunity status is mapped by hand."}
entities:
  - {"name": "ACCOUNT", "module": "salesforce", "level": "master", "title": "Salesforce Account (a company, or a person in orgs with person accounts)", "key": ["ID"], "area": "customers", "note": "ID has 18 characters through the API. The Younium connector sends Accounts to Younium and writes this ID into the Younium account's External CRM Id. PARENT_ID names the parent account in a hierarchy. In an org with person accounts an Account row can be a person (IS_PERSON_ACCOUNT), and its name is then personal data.", "sources": ["sf_object_reference"]}
  - {"name": "CONTACT", "module": "salesforce", "level": "partner", "title": "Contact (a person at an account)", "key": ["ID"], "area": "customers", "note": "A contact belongs to one account (ACCOUNT_ID; it can be empty for private contacts). Personal data throughout.", "sources": ["sf_object_reference"]}
  - {"name": "CONTRACT", "module": "salesforce", "level": "header", "title": "Contract (a business agreement with an account; orders and opportunities can refer to it)", "key": ["ID"], "unique_keys": [["CONTRACT_NUMBER"]], "area": "sales", "note": "CONTRACT_NUMBER is an auto-number. START_DATE and CONTRACT_TERM (months) give the term; STATUS the state. A Salesforce contract is not a Younium subscription: the subscription lives in Younium and is linked, if at all, through the account.", "sources": ["sf_object_reference"]}
  - {"name": "OPPORTUNITY", "module": "salesforce", "level": "header", "title": "Opportunity (a deal in the pipeline; the Younium connector sends it to Younium as the order)", "key": ["ID"], "amounts": [{"column": "AMOUNT", "level": "header", "currency": "CURRENCY_ISO_CODE when the org has multi-currency enabled; otherwise the org's corporate currency, and there is no currency column"}], "area": "sales", "note": "When an opportunity has products (OPPORTUNITYLINEITEM), AMOUNT is the sum of their TOTAL_PRICE and is read-only: joined with its line items the amount is repeated once per line. STAGE_NAME and IS_WON/IS_CLOSED say where the deal stands; the connector maps the stage to a Younium status by hand.", "sources": ["sf_object_reference", "sf_opportunitylineitem"]}
  - {"name": "OPPORTUNITYLINEITEM", "module": "salesforce", "level": "item", "title": "Opportunity product (a line of an opportunity: a price book entry, quantity and price)", "key": ["ID"], "amounts": [{"column": "TOTAL_PRICE", "level": "item", "currency": "the opportunity's currency (OPPORTUNITY.CURRENCY_ISO_CODE in a multi-currency org)"}], "area": "sales", "note": "The product is chosen through a price book entry (PRICEBOOK_ENTRY_ID); PRODUCT2_ID is derived from it and read-only. UNIT_PRICE is a price, TOTAL_PRICE = QUANTITY times UNIT_PRICE (minus discount) the amount. The Younium connector sends these as Opportunity Products to Younium.", "sources": ["sf_opportunitylineitem"]}
  - {"name": "ORDER", "module": "salesforce", "level": "header", "title": "Order (an agreement to provide products; may come from an opportunity and sit under a contract)", "key": ["ID"], "unique_keys": [["ORDER_NUMBER"]], "amounts": [{"column": "TOTAL_AMOUNT", "level": "header", "currency": "CURRENCY_ISO_CODE when multi-currency is enabled, otherwise the org's corporate currency"}], "area": "sales", "note": "TOTAL_AMOUNT is the sum of the order products' TOTAL_PRICE: joined with ORDERITEM it is repeated once per line. ORDER_NUMBER is an auto-number. The Younium connector described in the sources sends opportunities, not orders; an org that uses Orders has them beside the opportunities.", "sources": ["sf_object_reference"]}
  - {"name": "ORDERITEM", "module": "salesforce", "level": "item", "title": "Order product (a line of an order)", "key": ["ID"], "amounts": [{"column": "TOTAL_PRICE", "level": "item", "currency": "the order's currency"}], "area": "sales", "note": "Like the opportunity product: the product comes through PRICEBOOK_ENTRY_ID, PRODUCT2_ID is derived and read-only.", "sources": ["sf_object_reference"]}
  - {"name": "PRICEBOOKENTRY", "module": "salesforce", "level": "master", "title": "Price book entry (a product's price in one price book and currency)", "key": ["ID"], "area": "product catalog", "note": "One row per product, price book (PRICEBOOK2_ID; the Pricebook2 object is not described here) and, in a multi-currency org, currency. UNIT_PRICE is a list price, not an amount.", "sources": ["sf_object_reference"]}
  - {"name": "PRODUCT2", "module": "salesforce", "level": "master", "title": "Product (the product catalog)", "key": ["ID"], "area": "product catalog", "note": "PRODUCT_CODE is free text and not enforced unique. How the Younium connector matches a Younium product to a Product2 (a code, an external id field of its package) is not in what we could read.", "sources": ["sf_object_reference"]}
  - {"name": "ACCOUNTS", "module": "younium", "level": "master", "title": "Younium accounts (the customers that are billed)", "key": ["ID"], "unique_keys": [["ACCOUNT_NUMBER"]], "area": "customers", "note": "ID is a GUID; ACCOUNT_NUMBER is the number people use. EXTERNAL_CRM_ID holds the Salesforce Account Id when the Salesforce connector created or linked the account (a fixed mapping); EXTERNAL_ERP_ID the account's id in the ERP. CURRENCY is the account's currency: amounts of its subscriptions and invoices are in it. Field names after the API's camelCase (accountNumber, externalCrmId): a landing in snake case is read the same.", "sources": ["younium_api_v2", "younium_sf_integration"]}
  - {"name": "CHARGES", "module": "younium", "level": "master", "title": "Charges of a charge plan (the items an account is charged for: recurring, one-off, usage, measured)", "key": ["ID"], "unique_keys": [["CHARGE_NUMBER"]], "area": "product catalog", "note": "CHARGE_TYPE is Recurring, One-off, Usage or Measured; the price is a list price per PRICE_PERIOD and not an amount: what an account pays is on SUBSCRIPTION_CHARGES, what it was billed on INVOICE_LINES. Usage and measured charges take their quantity from usage records, not from the subscription.", "sources": ["younium_api_v2", "younium_product_structure"]}
  - {"name": "CHARGE_PLANS", "module": "younium", "level": "master", "title": "Charge plans (a way of pricing a product; one product, several plans)", "key": ["ID"], "unique_keys": [["CHARGE_PLAN_NUMBER"]], "area": "product catalog", "note": "Nested under the product in the API (products[].chargePlans[]); landed as its own table it needs the product's id.", "sources": ["younium_api_v2", "younium_product_structure"]}
  - {"name": "INVOICES", "module": "younium", "level": "header", "title": "Invoices: header per invoice, with the account, the status (draft or posted) and the totals", "key": ["ID"], "unique_keys": [["INVOICE_NUMBER"]], "amounts": [{"column": "TOTAL_AMOUNT", "level": "header", "currency": "CURRENCY"}, {"column": "SUB_TOTAL", "level": "header", "currency": "CURRENCY"}, {"column": "TAX_AMOUNT", "level": "header", "currency": "CURRENCY"}], "area": "billing", "note": "TOTAL_AMOUNT is the whole invoice; a join with INVOICE_LINES repeats it once per line (the check 'the total that doubles'). STATUS tells a draft from a posted invoice: drafts can still change and need not carry a final number; billed revenue is the posted invoices.", "sources": ["younium_api_v2"]}
  - {"name": "INVOICE_LINES", "module": "younium", "level": "item", "title": "Invoice lines (one per charge billed for a service period)", "key": ["ID"], "amounts": [{"column": "AMOUNT", "level": "item", "currency": "INVOICES.CURRENCY"}], "area": "billing", "note": "Nested under the invoice in the API (invoiceLines[]). A line names what it bills by number: CHARGE_NUMBER, PRODUCT_NUMBER and the subscription's number; which of these the line carries, and under which names, could not be read, so those links are listed and not applied. SERVICE_PERIOD_START_DATE and SERVICE_PERIOD_END_DATE say what period the line bills.", "sources": ["younium_api_v2"]}
  - {"name": "PAYMENTS", "module": "younium", "level": "header", "title": "Payments that settle invoices", "key": ["ID"], "amounts": [{"column": "AMOUNT", "level": "header", "currency": "the invoice's CURRENCY (INVOICES)"}], "area": "billing", "note": "A payment settles an open invoice (POST /Payments in API 2.1). Whether one payment can settle several invoices, and then lands as several rows or with a link table, could not be read: the link to the invoice is applied as many-to-one and must be confirmed with validate_plan.", "sources": ["younium_api_v2", "younium_api_news"]}
  - {"name": "PRODUCTS", "module": "younium", "level": "master", "title": "Products (what is sold; each has one or more charge plans)", "key": ["ID"], "unique_keys": [["PRODUCT_NUMBER"]], "area": "product catalog", "note": "A product carries no price: prices sit on the charges of its charge plans.", "sources": ["younium_api_v2", "younium_product_structure"]}
  - {"name": "SALES_ORDERS", "module": "younium", "level": "header", "title": "Sales orders (the document that creates or changes a subscription)", "key": ["ID"], "unique_keys": [["SALES_ORDER_NUMBER"]], "area": "subscriptions", "note": "Listed from the API's resource list; its fields and how it points at the subscription it created could not be read: unverified.", "sources": ["younium_api_v2"]}
  - {"name": "SUBSCRIPTIONS", "module": "younium", "level": "header", "title": "Subscriptions (orders): one row per subscription number, with the account and the invoice account", "key": ["ID"], "unique_keys": [["SUBSCRIPTION_NUMBER"]], "area": "subscriptions", "note": "The API calls the number orderNumber. ACCOUNT_ID is the account the subscription belongs to, INVOICE_ACCOUNT_ID the account that receives the invoices; they can differ. A subscription carries no amount: its charges and quantities sit on the version valid for a period (SUBSCRIPTION_VERSIONS, SUBSCRIPTION_CHARGES). Whether a landing has one row per subscription or one row per version is the integrator's choice: in the API every version is returned with the subscription's number, so a table with the version's id as key is SUBSCRIPTION_VERSIONS below.", "sources": ["younium_api_subscriptions"]}
  - {"name": "SUBSCRIPTION_CHARGES", "module": "younium", "level": "item", "title": "Charges on a subscription version (the agreed price and quantity per charge, per version)", "key": ["ID"], "amounts": [{"column": "PRICE", "level": "item", "currency": "the subscription's currency (SUBSCRIPTIONS.CURRENCY when the landing has it, otherwise the account's CURRENCY)"}], "area": "subscriptions", "note": "Nested in the API under the version's products (products[].charges[]); the pack reads it as one table with the version's id and the catalog charge's id. PRICE is the agreed price per price period for this version: the recurring revenue of a subscription on a date is the sum over the charges of the one version valid on that date, recurring charges only, normalized to a month or a year (MRR, ARR). Summing PRICE over all versions is wrong by the number of versions.", "sources": ["younium_api_subscriptions"]}
  - {"name": "SUBSCRIPTION_VERSIONS", "module": "younium", "level": "version", "title": "Subscription versions: every activated change to a subscription is a new version with its own effective period", "key": ["ID"], "unique_keys": [["SUBSCRIPTION_ID", "VERSION"]], "area": "subscriptions", "note": "VERSION counts up; IS_LAST_VERSION marks the newest; EFFECTIVE_START_DATE and EFFECTIVE_END_DATE bound the period the version holds for. One version is valid on a given date. A measure that sums over all versions of a subscription (seats, recurring price) counts every change again; take the version valid on the date, or the last version.", "sources": ["younium_api_subscriptions"]}
candidate_relationships:
  - {"from": "ACCOUNT.PARENT_ID", "to": "ACCOUNT.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": false, "role": "parent", "condition": "The account hierarchy, a reference of a table to itself; listed so that the column is not read as anything else.", "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "CONTACT.ACCOUNT_ID", "to": "ACCOUNT.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "OPPORTUNITY.ACCOUNT_ID", "to": "ACCOUNT.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "OPPORTUNITY.CONTRACT_ID", "to": "CONTRACT.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "OPPORTUNITYLINEITEM.OPPORTUNITY_ID", "to": "OPPORTUNITY.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality", "amount_level"], "sources": ["sf_opportunitylineitem"]}
  - {"from": "OPPORTUNITYLINEITEM.PRICEBOOK_ENTRY_ID", "to": "PRICEBOOKENTRY.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["sf_opportunitylineitem"]}
  - {"from": "OPPORTUNITYLINEITEM.PRODUCT2_ID", "to": "PRODUCT2.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "role": "product", "condition": "Derived from the price book entry and read-only; the same product the entry names.", "validation": ["referential_integrity", "cardinality"], "sources": ["sf_opportunitylineitem"]}
  - {"from": "PRICEBOOKENTRY.PRODUCT2_ID", "to": "PRODUCT2.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "ORDER.ACCOUNT_ID", "to": "ACCOUNT.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "ORDER.CONTRACT_ID", "to": "CONTRACT.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "ORDER.OPPORTUNITY_ID", "to": "OPPORTUNITY.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality", "amount_level"], "sources": ["sf_object_reference"]}
  - {"from": "ORDERITEM.ORDER_ID", "to": "ORDER.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality", "amount_level"], "sources": ["sf_object_reference"]}
  - {"from": "ORDERITEM.PRICEBOOK_ENTRY_ID", "to": "PRICEBOOKENTRY.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "ORDERITEM.PRODUCT2_ID", "to": "PRODUCT2.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "role": "product", "condition": "Derived from the price book entry and read-only.", "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "CONTRACT.ACCOUNT_ID", "to": "ACCOUNT.ID", "cardinality": "many-to-one", "kind": "key", "module": "salesforce", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["sf_object_reference"]}
  - {"from": "ACCOUNTS.EXTERNAL_CRM_ID", "to": "ACCOUNT.ID", "cardinality": "many-to-one", "kind": "key", "module": "younium", "rule": "Younium + Salesforce pack", "applied": true, "role": "salesforce_account", "condition": "Holds for accounts the Salesforce connector created or linked: External CRM Id is filled from the Salesforce Account Id and cannot be mapped otherwise. Accounts created in Younium alone have no value (NULL, not an orphan). Salesforce shows ids with 15 characters and returns 18 through the API; a 15-character value finds nothing against an 18-character ACCOUNT.ID.", "validation": ["referential_integrity", "cardinality"], "sources": ["younium_sf_integration"]}
  - {"from": "SUBSCRIPTIONS.ACCOUNT_ID", "to": "ACCOUNTS.ID", "cardinality": "many-to-one", "kind": "key", "module": "younium", "rule": "Younium + Salesforce pack", "applied": true, "role": "account", "validation": ["referential_integrity", "cardinality"], "sources": ["younium_api_subscriptions"]}
  - {"from": "SUBSCRIPTIONS.INVOICE_ACCOUNT_ID", "to": "ACCOUNTS.ID", "cardinality": "many-to-one", "kind": "key", "module": "younium", "rule": "Younium + Salesforce pack", "applied": true, "role": "invoice_account", "validation": ["referential_integrity", "cardinality"], "sources": ["younium_api_subscriptions"]}
  - {"from": "SUBSCRIPTIONS.EXTERNAL_CRM_ID", "to": "OPPORTUNITY.ID", "cardinality": "many-to-one", "kind": "key", "module": "younium", "rule": "Younium + Salesforce pack", "applied": false, "condition": "The subscription carries an externalCRMId; whether the connector fills it with the Opportunity Id of the opportunity that created the subscription could not be read. Listed, not applied: confirm it against your rows.", "validation": ["referential_integrity", "cardinality", "amount_level"], "sources": ["younium_api_subscriptions", "younium_sf_integration"]}
  - {"from": "SUBSCRIPTION_VERSIONS.SUBSCRIPTION_ID", "to": "SUBSCRIPTIONS.ID", "cardinality": "many-to-one", "kind": "key", "module": "younium", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["younium_api_subscriptions"]}
  - {"from": "SUBSCRIPTION_CHARGES.SUBSCRIPTION_VERSION_ID", "to": "SUBSCRIPTION_VERSIONS.ID", "cardinality": "many-to-one", "kind": "key", "module": "younium", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["younium_api_subscriptions"]}
  - {"from": "SUBSCRIPTION_CHARGES.CHARGE_ID", "to": "CHARGES.ID", "cardinality": "many-to-one", "kind": "key", "module": "younium", "rule": "Younium + Salesforce pack", "applied": true, "validation": ["referential_integrity", "cardinality"], "sources": ["younium_api_subscriptions", "younium_product_structure"]}
