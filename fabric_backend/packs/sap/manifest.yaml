# sources, entities, candidate_relationships and traps are derived from the module files in this directory;
# regenerate them with: python -m fabric_backend.pack_manifest sap --write
# Hand-kept: id, version, title, source_systems, scope, sharing, fixtures, review_status, reviewed_by, reviewed_at, and check per trap.
id: sap
version: "0.1.0"
title: "SAP ERP: order to cash, procure to pay, finance, the accounting document, pricing and the business partner"
source_systems: ["SAP ERP 6.0 (ECC)", "SAP S/4HANA"]
scope: ["order-to-cash", "procure-to-pay", "finance", "accounting-document", "pricing", "business-partner"]
sharing: public-synthetic
rule: "SAP pack"
variants:
  ecc: "SAP ERP 6.0 (ECC). Not verified per enhancement package."
  s4hana: "SAP S/4HANA (on-premise and private cloud). Not verified per release."
modules:
  - {"module": "accounting_document", "title": "SAP accounting document: the link from billing to accounting, in ECC (BKPF/BSEG) and S/4HANA (BKPF/ACDOCA)", "status": "documented", "file": "packs/sap/accounting_document.json"}
  - {"module": "business_partner", "title": "SAP business partner: the partner, its roles, addresses and relationships, and the link from partner to customer and supplier (customer/vendor integration)", "status": "documented", "file": "packs/sap/business_partner.json"}
  - {"module": "finance", "title": "SAP finance: charts of accounts and G/L accounts, customer and supplier open items, cost and profit centers, and how journal lines point at them", "status": "documented", "file": "packs/sap/finance.json"}
  - {"module": "order_to_cash", "title": "SAP order to cash: customers, sales orders, deliveries, billing, document flow, partners", "status": "documented", "file": "packs/sap/order_to_cash.json"}
  - {"module": "pricing", "title": "SAP pricing: the condition lines of sales, billing and purchasing documents (KONV in ECC, PRCD_ELEMENTS in S/4HANA) and the condition records behind them", "status": "documented", "file": "packs/sap/pricing.json"}
  - {"module": "procure_to_pay", "title": "SAP procure to pay: suppliers, requisitions, purchase orders, purchase order history, supplier invoices", "status": "documented", "file": "packs/sap/procure_to_pay.json"}
sources:
  - {"id": "ms_fabric_mirroring_sap", "title": "Microsoft Fabric documentation: Mirroring SAP (via SAP Datasphere; sources S/4HANA, ECC, BW/4HANA, BW, Datasphere)", "url": "https://github.com/MicrosoftDocs/fabric-docs/blob/main/docs/mirroring/sap.md", "publisher": "Microsoft", "accessed": "2026-10-28", "verified": true, "note": "Read 28 October 2026 (ms.date 02/26/2026). Says which SAP systems the mirroring supports; it names no tables."}
  - {"id": "sap_help_address", "title": "SAP Help Portal: central address management (business address services): addresses, their versions and validity", "url": "https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE", "publisher": "SAP", "accessed": null, "verified": false, "note": "Not fetched in the writing session (network policy)."}
  - {"id": "sap_help_bp", "title": "SAP Help Portal: SAP Business Partner (general data, roles, addresses, relationships between partners)", "url": "https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE", "publisher": "SAP", "accessed": null, "verified": false, "note": "help.sap.com could not be reached from the session that wrote this module (network policy); cited from public knowledge of the documentation, to be re-checked."}
  - {"id": "sap_help_client", "title": "SAP Help Portal: ABAP keyword documentation, client handling (the client column as the first key field of client-specific tables)", "url": "https://help.sap.com/doc/abapdocu_latest_index_htm/latest/en-US/index.htm", "publisher": "SAP", "accessed": null, "verified": false, "note": "Not fetched in the writing session (network policy)."}
  - {"id": "sap_help_co", "title": "SAP Help Portal: SAP ERP Controlling, controlling area, cost center and profit center master data (validity periods)", "url": "https://help.sap.com/docs/SAP_ERP", "publisher": "SAP", "accessed": null, "verified": false, "note": "Not fetched in the writing session (network policy)."}
  - {"id": "sap_help_cvi", "title": "SAP Help Portal: SAP S/4HANA, customer/vendor integration (CVI) between business partner, customer and supplier", "url": "https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE", "publisher": "SAP", "accessed": null, "verified": false, "note": "Not fetched in the writing session (network policy)."}
  - {"id": "sap_help_fi", "title": "SAP Help Portal: SAP ERP Financial Accounting, accounting document header and line items", "url": "https://help.sap.com/docs/SAP_ERP", "publisher": "SAP", "accessed": null, "verified": false, "note": "help.sap.com could not be reached from the session that wrote this pack (network policy)."}
  - {"id": "sap_help_fi_gl", "title": "SAP Help Portal: SAP ERP Financial Accounting, general ledger accounts (chart of accounts and company code segments), customer and vendor open items", "url": "https://help.sap.com/docs/SAP_ERP", "publisher": "SAP", "accessed": null, "verified": false, "note": "help.sap.com could not be reached from the session that wrote this module (network policy); cited from public knowledge of the documentation, to be re-checked."}
  - {"id": "sap_help_mm", "title": "SAP Help Portal: SAP ERP and SAP S/4HANA product documentation, Materials Management (purchasing documents, purchase order history, logistics invoice verification)", "url": "https://help.sap.com/docs/SAP_ERP", "publisher": "SAP", "accessed": null, "verified": false, "note": "help.sap.com could not be reached from the session that wrote this module (network policy); cited from public knowledge of the documentation, to be re-checked."}
  - {"id": "sap_help_pricing", "title": "SAP Help Portal: SAP ERP Sales and Distribution / Materials Management, pricing and the condition technique (condition types, condition records, document conditions)", "url": "https://help.sap.com/docs/SAP_ERP", "publisher": "SAP", "accessed": null, "verified": false, "note": "help.sap.com could not be reached from the session that wrote this module (network policy); cited from public knowledge of the documentation, to be re-checked."}
  - {"id": "sap_help_s4_bp", "title": "SAP Help Portal: SAP S/4HANA, business partner as the maintenance object for customers and suppliers", "url": "https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE", "publisher": "SAP", "accessed": null, "verified": false, "note": "Not fetched in the writing session (network policy)."}
  - {"id": "sap_help_s4_finance", "title": "SAP Help Portal: SAP S/4HANA Finance, the universal journal (ACDOCA) as the line-item table of accounting", "url": "https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE", "publisher": "SAP", "accessed": null, "verified": false, "note": "Not fetched in the writing session (network policy)."}
  - {"id": "sap_help_sd", "title": "SAP Help Portal: SAP ERP and SAP S/4HANA product documentation, Sales and Distribution (sales, shipping and billing documents)", "url": "https://help.sap.com/docs/SAP_ERP", "publisher": "SAP", "accessed": null, "verified": false, "note": "help.sap.com could not be reached from the session that wrote this pack (network policy); cited from public knowledge of the documentation, to be re-checked."}
  - {"id": "sap_learning_s4_sales", "title": "SAP Learning: Exploring functions and innovations in SAP S/4HANA Sales, lesson 'Identifying data model simplifications in SAP S/4HANA' (document conditions moved from KONV to PRCD_ELEMENTS)", "url": "https://learning.sap.com/learning-journeys/exploring-functions-and-innovations-in-sap-s-4hana-sales/identifying-data-model-simplifications-in-sap-s-4hana_fd1c3867-7016-40f1-9e98-3d44a5e81f25", "publisher": "SAP", "accessed": null, "verified": false, "note": "Found in a web search on 28 October 2026; the search summary named a pricing change on this page. The page itself could not be fetched (network policy)."}
  - {"id": "sap_ontology", "title": "Krusmaster/sap-ontology README: header/item pairs VBAK -> VBAP (join on VBELN) and VBAP -> VBEP (join on VBELN, POSNR)", "url": "https://github.com/Krusmaster/sap-ontology", "publisher": "Gustav Kruse", "accessed": null, "verified": true, "note": "Used only where it agrees with SAP's public documentation of the same tables."}
entities:
  - {"name": "ACDOCA", "module": "accounting_document", "level": "item", "title": "Universal journal, line items", "key": ["RCLNT", "RLDNR", "RBUKRS", "GJAHR", "BELNR", "DOCLN"], "amounts": [{"column": "WSL", "level": "item", "currency": "RWCUR"}, {"column": "HSL", "level": "item", "currency": "RHCUR"}], "variants": ["s4hana"], "note": "Amounts are signed. Filter on one ledger (RLDNR) before summing, or each posting counts once per ledger.", "sources": ["sap_help_s4_finance"]}
  - {"name": "BKPF", "module": "accounting_document", "level": "header", "title": "Accounting document, header", "key": ["MANDT", "BUKRS", "BELNR", "GJAHR"], "note": "BELNR is unique only within company code and fiscal year: all three are needed, with MANDT.", "sources": ["sap_help_fi"]}
  - {"name": "BSEG", "module": "accounting_document", "level": "item", "title": "Accounting document, line items", "key": ["MANDT", "BUKRS", "BELNR", "GJAHR", "BUZEI"], "amounts": [{"column": "WRBTR", "level": "item", "currency": "BKPF.WAERS"}, {"column": "DMBTR", "level": "item", "currency": "company code currency (T001.WAERS)"}], "variants": ["ecc"], "note": "Amounts are unsigned; SHKZG says debit or credit.", "sources": ["sap_help_fi"]}
  - {"name": "ADR2", "module": "business_partner", "level": "master", "title": "Telephone numbers of addresses", "key": ["CLIENT", "ADDRNUMBER", "PERSNUMBER", "DATE_FROM", "CONSNUMBER"], "note": "Several numbers per address (CONSNUMBER counts them), per person of an organization's address (PERSNUMBER, blank for the address itself). FLGDEFAULT marks the standard number; R3_USER says whether a number is a mobile number.", "sources": ["sap_help_address"]}
  - {"name": "ADR6", "module": "business_partner", "level": "master", "title": "E-mail addresses of addresses", "key": ["CLIENT", "ADDRNUMBER", "PERSNUMBER", "DATE_FROM", "CONSNUMBER"], "note": "Several e-mail addresses per address and person, like ADR2. FLGDEFAULT marks the standard one.", "sources": ["sap_help_address"]}
  - {"name": "ADRC", "module": "business_partner", "level": "master", "title": "Addresses (central address management)", "key": ["CLIENT", "ADDRNUMBER", "DATE_FROM", "NATION"], "note": "Shared by customers, suppliers, company codes, business partners and document partners, through an address number. The key also has the start of validity (DATE_FROM) and the version (NATION: blank for the standard version, other values for the same address in another script, such as Latin and Kanji).", "sources": ["sap_help_address"]}
  - {"name": "BUT000", "module": "business_partner", "level": "master", "title": "Business partner, general data", "key": ["CLIENT", "PARTNER"], "unique_keys": [["CLIENT", "PARTNER_GUID"]], "note": "The client column is CLIENT, not MANDT. PARTNER_GUID is a second unique identifier, the one the link tables use. TYPE says person, organization or group.", "sources": ["sap_help_bp"]}
  - {"name": "BUT020", "module": "business_partner", "level": "master", "title": "Business partner addresses", "key": ["CLIENT", "PARTNER", "ADDRNUMBER"], "note": "A partner can have several addresses; the address itself is kept in the central address tables under ADDRNUMBER.", "sources": ["sap_help_bp"]}
  - {"name": "BUT050", "module": "business_partner", "level": "master", "title": "Relationships between business partners", "key": ["CLIENT", "RELNR", "PARTNER1", "PARTNER2", "DATE_TO"], "note": "Time-dependent: DATE_TO is in the key. RELTYP says the kind (contact person of, belongs to and so on), and the direction matters.", "sources": ["sap_help_bp"]}
  - {"name": "BUT100", "module": "business_partner", "level": "master", "title": "Business partner roles", "key": ["CLIENT", "PARTNER", "RLTYP", "DFVAL"], "note": "One row per role a partner has (customer, supplier, contact and others): a partner with three roles has three rows.", "sources": ["sap_help_bp"]}
  - {"name": "CVI_CUST_LINK", "module": "business_partner", "level": "master", "title": "Link between business partner and customer", "key": ["CLIENT", "PARTNER_GUID"], "note": "One row per partner that is a customer. The partner is named by its GUID, not its number.", "sources": ["sap_help_cvi"]}
  - {"name": "CVI_VEND_LINK", "module": "business_partner", "level": "master", "title": "Link between business partner and supplier", "key": ["CLIENT", "PARTNER_GUID"], "note": "One row per partner that is a supplier. The partner is named by its GUID, not its number.", "sources": ["sap_help_cvi"]}
  - {"name": "BSAD", "module": "finance", "level": "item", "title": "Customer cleared items", "key": ["MANDT", "BUKRS", "KUNNR", "UMSKS", "UMSKZ", "AUGDT", "AUGBL", "ZUONR", "GJAHR", "BELNR", "BUZEI"], "amounts": [{"column": "WRBTR", "level": "item", "currency": "WAERS"}, {"column": "DMBTR", "level": "item", "currency": "company code currency (T001.WAERS)"}], "variants": ["ecc"], "sources": ["sap_help_fi_gl", "sap_help_s4_finance"]}
  - {"name": "BSAK", "module": "finance", "level": "item", "title": "Supplier cleared items", "key": ["MANDT", "BUKRS", "LIFNR", "UMSKS", "UMSKZ", "AUGDT", "AUGBL", "ZUONR", "GJAHR", "BELNR", "BUZEI"], "amounts": [{"column": "WRBTR", "level": "item", "currency": "WAERS"}, {"column": "DMBTR", "level": "item", "currency": "company code currency (T001.WAERS)"}], "variants": ["ecc"], "sources": ["sap_help_fi_gl", "sap_help_s4_finance"]}
  - {"name": "BSID", "module": "finance", "level": "item", "title": "Customer open items", "key": ["MANDT", "BUKRS", "KUNNR", "UMSKS", "UMSKZ", "AUGDT", "AUGBL", "ZUONR", "GJAHR", "BELNR", "BUZEI"], "amounts": [{"column": "WRBTR", "level": "item", "currency": "WAERS"}, {"column": "DMBTR", "level": "item", "currency": "company code currency (T001.WAERS)"}], "variants": ["ecc"], "note": "Copies of customer lines of BSEG that are still open; cleared ones move to BSAD. Marked ECC: in S/4HANA it is read through a compatibility view, not asserted here.", "sources": ["sap_help_fi_gl", "sap_help_s4_finance"]}
  - {"name": "BSIK", "module": "finance", "level": "item", "title": "Supplier open items", "key": ["MANDT", "BUKRS", "LIFNR", "UMSKS", "UMSKZ", "AUGDT", "AUGBL", "ZUONR", "GJAHR", "BELNR", "BUZEI"], "amounts": [{"column": "WRBTR", "level": "item", "currency": "WAERS"}, {"column": "DMBTR", "level": "item", "currency": "company code currency (T001.WAERS)"}], "variants": ["ecc"], "sources": ["sap_help_fi_gl", "sap_help_s4_finance"]}
  - {"name": "CEPC", "module": "finance", "level": "master", "title": "Profit center master", "key": ["MANDT", "PRCTR", "DATBI", "KOKRS"], "note": "Time-dependent like CSKS; the controlling area is the last key column.", "sources": ["sap_help_co"]}
  - {"name": "CSKS", "module": "finance", "level": "master", "title": "Cost center master", "key": ["MANDT", "KOKRS", "KOSTL", "DATBI"], "note": "Time-dependent: one row per validity period, ending at DATBI. A cost center number alone matches every period.", "sources": ["sap_help_co"]}
  - {"name": "KNB1", "module": "finance", "level": "master", "title": "Customer master, company code data", "key": ["MANDT", "KUNNR", "BUKRS"], "note": "One row per customer and company code: the reconciliation account (AKONT) and payment terms the receivables of that company use.", "sources": ["sap_help_fi_gl"]}
  - {"name": "SKA1", "module": "finance", "level": "master", "title": "G/L account, chart of accounts segment", "key": ["MANDT", "KTOPL", "SAKNR"], "note": "An account number means something only within its chart of accounts (KTOPL).", "sources": ["sap_help_fi_gl"]}
  - {"name": "SKB1", "module": "finance", "level": "master", "title": "G/L account, company code segment", "key": ["MANDT", "BUKRS", "SAKNR"], "note": "Has no chart of accounts column: the chart comes from the company code (T001.KTOPL).", "sources": ["sap_help_fi_gl"]}
  - {"name": "T004", "module": "finance", "level": "organization", "title": "Charts of accounts", "key": ["MANDT", "KTOPL"], "sources": ["sap_help_fi_gl"]}
  - {"name": "TKA01", "module": "finance", "level": "organization", "title": "Controlling areas", "key": ["MANDT", "KOKRS"], "sources": ["sap_help_co"]}
  - {"name": "KNA1", "module": "order_to_cash", "level": "master", "title": "Customer master, general data", "key": ["MANDT", "KUNNR"], "note": "In S/4HANA customers are maintained as business partners; KNA1 is still the customer table that sales documents point at.", "sources": ["sap_help_sd"]}
  - {"name": "KNVK", "module": "order_to_cash", "level": "master", "title": "Contact persons", "key": ["MANDT", "PARNR"], "note": "One row per contact person of a customer (KUNNR) or a supplier (LIFNR); NAMEV is the first name, NAME1 the last name. Every row is about a person.", "sources": ["sap_help_sd"]}
  - {"name": "KNVV", "module": "order_to_cash", "level": "master", "title": "Customer master, sales area data", "key": ["MANDT", "KUNNR", "VKORG", "VTWEG", "SPART"], "note": "One row per customer and sales area (sales organization, distribution channel, division).", "sources": ["sap_help_sd"]}
  - {"name": "LIKP", "module": "order_to_cash", "level": "header", "title": "Delivery, header", "key": ["MANDT", "VBELN"], "sources": ["sap_help_sd"]}
  - {"name": "LIPS", "module": "order_to_cash", "level": "item", "title": "Delivery, items", "key": ["MANDT", "VBELN", "POSNR"], "sources": ["sap_help_sd"]}
  - {"name": "MAKT", "module": "order_to_cash", "level": "text", "title": "Material descriptions", "key": ["MANDT", "MATNR", "SPRAS"], "note": "One row per material and language: filter on SPRAS before joining, or every order line is repeated once per language.", "sources": ["sap_help_sd"]}
  - {"name": "MARA", "module": "order_to_cash", "level": "master", "title": "Material master, general data", "key": ["MANDT", "MATNR"], "note": "MATNR is 18 characters in ECC and 40 in S/4HANA; numeric material numbers are stored with leading zeros.", "sources": ["sap_help_sd"]}
  - {"name": "T001", "module": "order_to_cash", "level": "organization", "title": "Company codes", "key": ["MANDT", "BUKRS"], "sources": ["sap_help_sd"]}
  - {"name": "TSPA", "module": "order_to_cash", "level": "organization", "title": "Divisions", "key": ["MANDT", "SPART"], "sources": ["sap_help_sd"]}
  - {"name": "TVKO", "module": "order_to_cash", "level": "organization", "title": "Sales organizations", "key": ["MANDT", "VKORG"], "sources": ["sap_help_sd"]}
  - {"name": "TVTW", "module": "order_to_cash", "level": "organization", "title": "Distribution channels", "key": ["MANDT", "VTWEG"], "sources": ["sap_help_sd"]}
  - {"name": "VBAK", "module": "order_to_cash", "level": "header", "title": "Sales document, header", "key": ["MANDT", "VBELN"], "unique_keys": [["MANDT", "KNUMV"]], "amounts": [{"column": "NETWR", "level": "header", "currency": "WAERK"}], "note": "Orders, quotations, contracts and returns share this table; AUART (and VBTYP) tell them apart.", "sources": ["sap_help_sd", "sap_ontology"]}
  - {"name": "VBAP", "module": "order_to_cash", "level": "item", "title": "Sales document, items", "key": ["MANDT", "VBELN", "POSNR"], "amounts": [{"column": "NETWR", "level": "item", "currency": "WAERK"}], "sources": ["sap_help_sd", "sap_ontology"]}
  - {"name": "VBEP", "module": "order_to_cash", "level": "schedule_line", "title": "Sales document, schedule lines", "key": ["MANDT", "VBELN", "POSNR", "ETENR"], "note": "Several schedule lines per item: a join of VBAP and VBEP repeats the item's NETWR once per schedule line.", "sources": ["sap_help_sd", "sap_ontology"]}
  - {"name": "VBFA", "module": "order_to_cash", "level": "document_flow", "title": "Sales document flow", "key": ["MANDT", "VBELV", "POSNV", "VBELN", "POSNN", "VBTYP_N"], "note": "A link table between any preceding and any subsequent document: an order item can have several deliveries and a delivery can serve several orders. VBTYP_V and VBTYP_N say which kind of document each side is.", "sources": ["sap_help_sd", "sap_learning_s4_sales"]}
  - {"name": "VBPA", "module": "order_to_cash", "level": "partner", "title": "Partners of sales, delivery and billing documents", "key": ["MANDT", "VBELN", "POSNR", "PARVW"], "note": "One row per document, item and partner function. POSNR 000000 holds the partners of the whole document. PARVW is the internal function code (AG sold-to, WE ship-to, RE bill-to, RG payer; shown as SP, SH, BP, PY in English logons). Sold-to, ship-to and payer may be three different customers.", "sources": ["sap_help_sd"]}
  - {"name": "VBRK", "module": "order_to_cash", "level": "header", "title": "Billing document, header", "key": ["MANDT", "VBELN"], "unique_keys": [["MANDT", "KNUMV"]], "amounts": [{"column": "NETWR", "level": "header", "currency": "WAERK"}, {"column": "MWSBK", "level": "header", "currency": "WAERK"}], "note": "Cancellations and credit memos are billing documents too; FKART and the cancellation flag decide whether to count them.", "sources": ["sap_help_sd"]}
  - {"name": "VBRP", "module": "order_to_cash", "level": "item", "title": "Billing document, items", "key": ["MANDT", "VBELN", "POSNR"], "amounts": [{"column": "NETWR", "level": "item", "currency": "VBRK.WAERK"}], "note": "The currency of an item amount is the header's WAERK: join VBRK before converting or adding across documents.", "sources": ["sap_help_sd"]}
  - {"name": "VBUK", "module": "order_to_cash", "level": "status", "title": "Sales document, header status", "key": ["MANDT", "VBELN"], "variants": ["ecc"], "note": "ECC only: in S/4HANA the status fields moved into VBAK, LIKP and VBRK.", "sources": ["sap_help_sd", "sap_learning_s4_sales"]}
  - {"name": "VBUP", "module": "order_to_cash", "level": "status", "title": "Sales document, item status", "key": ["MANDT", "VBELN", "POSNR"], "variants": ["ecc"], "note": "ECC only: in S/4HANA the status fields moved into VBAP, LIPS and VBRP.", "sources": ["sap_help_sd", "sap_learning_s4_sales"]}
  - {"name": "KONH", "module": "pricing", "level": "header", "title": "Condition record, header", "key": ["MANDT", "KNUMH"], "note": "Validity (DATAB, DATBI) and the condition type of a price or discount record.", "sources": ["sap_help_pricing"]}
  - {"name": "KONP", "module": "pricing", "level": "item", "title": "Condition record, items (rates)", "key": ["MANDT", "KNUMH", "KOPOS"], "note": "KBETR is a rate, not an amount: a price per KPEIN units of KMEIN, or a percentage, as KONWA and KRECH say.", "sources": ["sap_help_pricing"]}
  - {"name": "KONV", "module": "pricing", "level": "item", "title": "Document conditions (pricing lines of a document)", "key": ["MANDT", "KNUMV", "KPOSN", "STUNR", "ZAEHK"], "amounts": [{"column": "KWERT", "level": "item", "currency": "WAERS"}], "variants": ["ecc"], "note": "One row per condition (price, discount, surcharge, tax, subtotal) per item of a document; KPOSN 000000 holds conditions of the whole document. The document finds its conditions through its own KNUMV column, not through its document number.", "sources": ["sap_help_pricing"]}
  - {"name": "PRCD_ELEMENTS", "module": "pricing", "level": "item", "title": "Document conditions (pricing lines of a document), S/4HANA", "key": ["MANDT", "KNUMV", "KPOSN", "STUNR", "ZAEHK"], "amounts": [{"column": "KWERT", "level": "item", "currency": "WAERS"}], "variants": ["s4hana"], "note": "Takes KONV's place in S/4HANA with the same key.", "sources": ["sap_help_pricing", "sap_learning_s4_sales"]}
  - {"name": "T685", "module": "pricing", "level": "organization", "title": "Condition types", "key": ["MANDT", "KVEWE", "KAPPL", "KSCHL"], "note": "The key carries usage (KVEWE) and application (KAPPL): pricing in sales is usage A, application V; purchasing is application M. Document conditions carry only KSCHL, so the link is listed, not applied.", "sources": ["sap_help_pricing"]}
  - {"name": "EBAN", "module": "procure_to_pay", "level": "item", "title": "Purchase requisition, items", "key": ["MANDT", "BANFN", "BNFPO"], "note": "A requisition has no header table of its own: BANFN groups the items.", "sources": ["sap_help_mm"]}
