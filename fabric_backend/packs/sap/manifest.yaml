traps:
  - {"name": "ledger", "title": "One line per ledger in ACDOCA", "description": "ACDOCA carries the ledger in its key; a company with a leading and a parallel ledger has each posting twice. Pick a ledger before summing.", "module": "accounting_document", "sources": ["sap_help_s4_finance"], "check": "manual"}
  - {"name": "client_name", "title": "The client column is not always called MANDT", "description": "ACDOCA names its client column RCLNT and its company code RBUKRS. The pack maps them to MANDT and BUKRS of BKPF explicitly.", "module": "accounting_document", "sources": ["sap_help_s4_finance"], "check": "referential_integrity"}
  - {"name": "bp_number", "title": "The partner number is not the customer number", "description": "A business partner and the customer or supplier behind it can have different numbers, depending on how number ranges were set up. Join BUT000 to KNA1 or LFA1 through CVI_CUST_LINK or CVI_VEND_LINK, never on PARTNER = KUNNR.", "module": "business_partner", "sources": ["sap_help_cvi"], "check": "referential_integrity"}
  - {"name": "bp_guid", "title": "The link tables use the partner's GUID", "description": "CVI_CUST_LINK and CVI_VEND_LINK name the partner by PARTNER_GUID, a 16-byte identifier. Extraction tools may write it as binary, as 32 hex characters or as a dashed GUID; both sides of the join must come out in the same form.", "module": "business_partner", "sources": ["sap_help_cvi"], "check": "referential_integrity"}
  - {"name": "bp_client", "title": "CLIENT, not MANDT", "description": "The business partner tables call the client column CLIENT. The pack pairs it with MANDT of KNA1 and LFA1 explicitly.", "module": "business_partner", "sources": ["sap_help_bp"], "check": "referential_integrity"}
  - {"name": "bp_roles", "title": "Roles multiply partners", "description": "BUT100 has a row per role. Counting partners over a join with BUT100 counts a partner once per role; filter RLTYP to the role you mean.", "module": "business_partner", "sources": ["sap_help_bp"], "check": "manual"}
  - {"name": "bp_relationships", "title": "Partner relationships have validity and direction", "description": "BUT050 carries DATE_TO in the key and two partners with a direction; pick the period, and read PARTNER1 and PARTNER2 by the relationship type.", "module": "business_partner", "sources": ["sap_help_bp"], "check": "manual"}
  - {"name": "address_versions", "title": "An address has versions and periods", "description": "ADRC's key has the address number, the start of validity and the version (NATION). Joining customers or suppliers to ADRC on the number alone repeats them once per version and period: filter NATION to the standard version and pick the period valid on the date you report for. The pack applies these links that way, for the date of the call (round n28); a report for another date needs that date instead.", "module": "business_partner", "sources": ["sap_help_address"], "check": "referential_integrity"}
  - {"name": "document_address", "title": "A document can carry its own address", "description": "VBPA.ADRNR is filled when an order or delivery has an address of its own for a partner, such as a one-time ship-to address. Where it is empty, the partner's master address (KNA1.ADRNR) applies. Reports of where goods were shipped need the document address first.", "module": "business_partner", "sources": ["sap_help_address"], "check": "referential_integrity"}
  - {"name": "communication_rows", "title": "Several numbers and e-mail addresses per address", "description": "ADR2 and ADR6 hold one row per number or e-mail address of an address (CONSNUMBER), and per contact person of an organization (PERSNUMBER). A join with them multiplies the address; filter FLGDEFAULT for the standard number, and PERSNUMBER blank for the address itself.", "module": "business_partner", "sources": ["sap_help_address"], "check": "manual"}
  - {"name": "personal_data", "title": "Names, addresses, numbers and e-mail are personal data", "description": "Customers and suppliers can be people, and ADRC, ADR2 and ADR6 hold their names, streets, telephone numbers and e-mail addresses. The pack names these columns, so sample_rows masks them and drafted queries and gold views leave them out, as for any column the privacy rules flag; show_personal_data=true shows them, and the user's own permissions apply either way. SAP's field names (SMTP_ADDR, TELF1, STRAS) say nothing to the general name rules.", "module": "business_partner", "sources": ["sap_help_address"], "check": "privacy"}
  - {"name": "open_items_twice", "title": "Open items are copies of journal lines", "description": "BSID, BSAD, BSIK and BSAK hold copies of customer and supplier lines of BSEG, split by open and cleared. Adding them to BSEG (or ACDOCA) counts the same posting twice, and open plus cleared together are all items: use one source per question. An item moves from the open to the cleared table when it is cleared, so a delta load on one table alone sees it disappear.", "module": "finance", "sources": ["sap_help_fi_gl"], "check": "manual"}
  - {"name": "time_dependent", "title": "Cost and profit centers have validity periods", "description": "CSKS and CEPC have DATBI (valid to) in the key: one cost center number has a row per period. Joining a journal line on the number alone multiplies it by the number of periods; pick the period in which the posting date falls. The pack applies these links as relationships of kind valid_on: the cost or profit center row whose DATAB..DATBI holds the posting date (round n25; before, they were only listed).", "module": "finance", "sources": ["sap_help_co"], "check": "referential_integrity"}
  - {"name": "chart_of_accounts", "title": "An account number needs its chart of accounts", "description": "SAKNR is unique only within a chart of accounts (KTOPL), and SKB1 and journal lines carry no KTOPL: it comes from the company code, T001.KTOPL. Join SKA1 (for the account's name) through T001, not on SAKNR alone.", "module": "finance", "sources": ["sap_help_fi_gl"], "check": "manual"}
  - {"name": "signs", "title": "Debit and credit", "description": "BSEG and the open-item tables store amounts without a sign and say debit or credit in SHKZG; ACDOCA stores signed amounts. A sum over ECC lines without SHKZG adds credits as debits.", "module": "finance", "sources": ["sap_help_fi_gl", "sap_help_s4_finance"], "check": "manual"}
  - {"name": "special_gl", "title": "Special G/L transactions in the open items", "description": "UMSKZ marks down payments, guarantees and other special G/L transactions in the open-item tables. A receivables total usually leaves them out or shows them apart.", "module": "finance", "sources": ["sap_help_fi_gl"], "check": "manual"}
  - {"name": "company_code_master", "title": "Customer and supplier data per company code", "description": "KNB1 (customers) and LFB1 (suppliers) hold one row per company code: the reconciliation account, payment terms and dunning data differ by company. Join open items and journal lines to them on the customer or supplier and the company code together.", "module": "finance", "sources": ["sap_help_fi_gl"], "check": "referential_integrity"}
  - {"name": "client", "title": "MANDT in every join", "description": "Every client-specific table starts its key with the client (MANDT). One database can hold several clients, so a join on VBELN alone can pair an order of one client with an item of another. The pack's keys and relationships always carry MANDT; when an extract has dropped the column, the pack drops it on both sides and says so.", "module": "order_to_cash", "sources": ["sap_help_client"], "check": "referential_integrity"}
  - {"name": "amount_levels", "title": "Header amounts and item amounts are different levels", "description": "VBAK.NETWR is the net value of the whole document, VBAP.NETWR that of one item. Summing VBAK.NETWR over a join with VBAP counts each order once per item (Krusgraph's 'the total that doubles' check, amounts.py); summing VBAP.NETWR over a join with VBEP counts each item once per schedule line. Sum each amount on its own table.", "module": "order_to_cash", "sources": ["sap_help_sd"], "check": "amount_level"}
  - {"name": "currency", "title": "Currency per document", "description": "NETWR is in the document currency WAERK, which can differ from document to document. Adding NETWR across documents without converting adds different currencies. VBRP has no currency of its own; its amounts are in VBRK.WAERK.", "module": "order_to_cash", "sources": ["sap_help_sd"], "check": "manual"}
  - {"name": "leading_zeros", "title": "Leading zeros in number columns", "description": "Document, customer and material numbers are text columns; numeric values are stored right-aligned with leading zeros (VBELN '0000012345'). A join with a source that stores 12345 as an integer or without zeros finds nothing. Pad or strip on one side, the same way everywhere.", "module": "order_to_cash", "sources": ["sap_help_sd"], "check": "referential_integrity"}
  - {"name": "document_flow", "title": "VBFA is many-to-many", "description": "An order item can be delivered in several deliveries and a delivery can serve several orders; the same holds between deliveries and invoices. VBFA records each pair. Joining orders to invoices through VBFA multiplies rows on both sides: aggregate on one side first, and filter VBTYP_V/VBTYP_N to the document kinds you mean.", "module": "order_to_cash", "sources": ["sap_help_sd", "sap_learning_s4_sales"], "check": "referential_integrity"}
  - {"name": "partners", "title": "Sold-to, ship-to and payer may differ", "description": "VBAK.KUNNR is the sold-to party. The ship-to party and the payer are rows of VBPA (PARVW), and on deliveries and billing documents in LIKP.KUNNR and VBRK.KUNRG. 'Revenue per customer' needs a choice of which of them.", "module": "order_to_cash", "sources": ["sap_help_sd"], "check": "manual"}
  - {"name": "texts", "title": "Text tables have one row per language", "description": "MAKT has one row per material and language; filter SPRAS before joining.", "module": "order_to_cash", "sources": ["sap_help_sd"], "check": "manual"}
  - {"name": "contact_persons", "title": "Contact persons are people, every row", "description": "KNVK holds one row per contact person of a customer or supplier: first and last name, telephone, birth date. Unlike KNA1, where a customer may be a company, every KNVK row is about a person. The pack names these columns as personal data, so sample_rows masks them.", "module": "order_to_cash", "sources": ["sap_help_sd"], "check": "privacy"}
  - {"name": "knumv", "title": "Documents find their conditions through KNUMV", "description": "VBAK, VBRK and EKKO carry a condition number KNUMV; their conditions are the KONV (ECC) or PRCD_ELEMENTS (S/4HANA) rows with that KNUMV, and an item's are those with KPOSN equal to the item number. Joining on the document number VBELN or EBELN finds nothing.", "module": "pricing", "sources": ["sap_help_pricing"], "check": "referential_integrity"}
  - {"name": "condition_sum", "title": "Summing all condition values is not the net value", "description": "A document's conditions include prices, discounts, surcharges, taxes, subtotals and statistical conditions. Adding every KWERT counts subtotals and statistical lines on top of the lines they summarise. Pick condition types (KSCHL), leave out inactive (KINAK) and statistical (KSTAT) lines, and remember that header conditions (KPOSN 000000) are also distributed to the items.", "module": "pricing", "sources": ["sap_help_pricing"], "check": "manual"}
