<svg class="hs-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 880" width="1040" height="880" role="img" aria-labelledby="hs3-title hs3-desc" focusable="false">
<title id="hs3-title">Sketch: how Krusgraph keeps itself up to date</title>
<desc id="hs3-desc">A hand-drawn sketch. A box, It watches: a new column in a source, a new table, a key that is no longer unique, data that is not fresh, a broken relationship, unused items, cost running away. Then a loop: Watch, every night and on change; Compare, desired with actual, which is the plan; Classify, where rules decide the risk. Two branches: Safe, done on its own (the catalog, tests, a new column), and Risky, a draft pull request that a mascot explains and you approve. Both lead to Rebuild and test (dbt tests, the rows prove it), then Learn from the decision (the same choice becomes the default), and an arrow back to Watch, round after round. Today: watching and dry runs. Next: fixing on its own.</desc>
