<text x="160" y="146" font-family="Nunito, 'Segoe UI', sans-serif" font-size="20" fill="#5B5660">Microsoft Fabric, connected.</text>
<text x="80" y="300" font-family="Fredoka, Nunito, 'Segoe UI', sans-serif" font-weight="600" font-size="66" fill="#1B1B1F">Understand how your</text>
<text x="80" y="380" font-family="Fredoka, Nunito, 'Segoe UI', sans-serif" font-weight="600" font-size="66" fill="#1B1B1F">Fabric tables fit together.</text>
<text x="80" y="450" font-family="Nunito, 'Segoe UI', sans-serif" font-size="28" fill="#5B5660">Suggested keys and relationships, each one explained.</text>
<text x="80" y="488" font-family="Nunito, 'Segoe UI', sans-serif" font-size="28" fill="#5B5660">Check them against your data, in Claude.</text>
