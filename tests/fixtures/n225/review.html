  display: flex;
  flex-direction: column;
  gap: var(--spacingVerticalL);
  padding: var(--spacingHorizontalXXL);
  box-sizing: border-box;
  width: 100%;
}

.krusgraph-empty-form {
  display: flex;
  flex-direction: column;
  gap: var(--spacingVerticalM);
  max-width: 360px;
}

.krusgraph-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacingVerticalXS);
}

.krusgraph-row {
  display: grid;
  grid-template-columns: 5.5rem minmax(0, 1fr) 7rem 7.5rem auto auto;
  align-items: center;
  gap: var(--spacingHorizontalS);
  padding: var(--spacingVerticalS) var(--spacingHorizontalS);
  border-bottom: 1px solid var(--colorNeutralStroke2);
}

/* n209: a link the rows hold says so under its Accept and Reject; rejecting it says what the outputs lose */
.krusgraph-row-holds,
.krusgraph-row-lost {
  grid-column: 2/-1;
}

.krusgraph-row-holds {
  color: var(--colorPaletteGreenForeground1);
  justify-self: end;
  text-align: end;
}

.krusgraph-row-open {
  background: var(--colorPaletteYellowBackground1);
}

.krusgraph-row-rejected .krusgraph-row-what {
  text-decoration: line-through;
  color: var(--colorNeutralForeground3);
}

.krusgraph-row-status {
  color: var(--colorNeutralForeground2);
}

.krusgraph-question {
  padding: var(--spacingVerticalS) var(--spacingHorizontalS);
  border-left: 3px solid var(--colorPaletteYellowBorder2);
}

.krusgraph-row-what {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow-wrap: anywhere;
}

.krusgraph-row-check {
  color: var(--colorNeutralForeground3);
}

.krusgraph-check-failed .krusgraph-row-check {
  color: var(--colorPaletteRedForeground1);
}

.krusgraph-check-passed .krusgraph-row-check {
  color: var(--colorPaletteGreenForeground1);
}

.krusgraph-pill {
  cursor: help;
  justify-self: start;
}

.krusgraph-actions,
.krusgraph-legend,
.krusgraph-choices {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacingHorizontalS);
  align-items: center;
}

.krusgraph-mascots-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--spacingVerticalS);
}

.krusgraph-mascots {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--spacingVerticalS);
}

.krusgraph-say {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr);
  gap: var(--spacingHorizontalS);
  align-items: start;
}

.krusgraph-fig {
  width: 48px;
  height: 48px;
}
.krusgraph-fig img {
  display: block;
  width: 100%;
  height: 100%;
  transform-origin: 50% 92%;
  transition: transform 0.25s ease;
}
.krusgraph-fig[data-pose=point] img, .krusgraph-fig[data-pose=explain] img {
  transform: rotate(-6deg);
}
.krusgraph-fig[data-pose=think] img {
  transform: rotate(7deg);
}
.krusgraph-fig[data-pose=notice] img {
  transform: translateY(-2px) scale(1.04);
}
.krusgraph-fig[data-pose=calm] img {
  transform: none;
}
.krusgraph-fig[data-pose=celebrate] img, .krusgraph-fig[data-pose=heart] img {
  animation: krusgraph-hop 0.9s ease-in-out 2;
}

@keyframes krusgraph-hop {
  0%, 100% {
    transform: translateY(0);
  }
  40% {
    transform: translateY(-6px) rotate(-4deg);
  }
  70% {
    transform: translateY(0) rotate(3deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  .krusgraph-fig img {
    transition: none;
    animation: none !important;
  }
}
.krusgraph-bubble {
  display: flex;
  flex-direction: column;
  gap: var(--spacingVerticalXXS);
  min-width: 0;
  padding: var(--spacingVerticalS) var(--spacingHorizontalM);
  background: var(--colorNeutralBackground2);
  border: 1px solid var(--colorNeutralStroke2);
  border-left: 4px solid var(--kg-mascot, var(--colorNeutralStroke1));
  border-radius: var(--borderRadiusMedium) var(--borderRadiusXLarge) var(--borderRadiusXLarge) var(--borderRadiusXLarge);
}

.krusgraph-say.glad .krusgraph-bubble {
  border-color: var(--colorPaletteGreenBorder2);
  border-left-color: var(--kg-mascot);
}

.krusgraph-who {
  font-weight: var(--fontWeightSemibold);
  color: var(--colorNeutralForeground2);
}

.krusgraph-map,
.krusgraph-flow {
  --kg-font: var(--fontFamilyBase);
  --kg-bg: var(--colorNeutralBackground1);
  --kg-card: var(--colorNeutralBackground2);
  --kg-ink: var(--colorNeutralForeground1);
  --kg-muted: var(--colorNeutralForeground3);
  --kg-line: var(--colorNeutralStroke1);
  --kg-ok: var(--colorPaletteGreenForeground1);
  --kg-bad: var(--colorPaletteRedForeground1);
  --kg-warn: var(--colorPaletteMarigoldForeground1);
  --kg-radius: var(--borderRadiusMedium);
  --kg-pic-edge: var(--colorNeutralForeground2);
  --kg-pic-accent: var(--colorBrandForeground1);
  --kg-pic-grp-a: var(--colorPaletteRedBackground1);
  --kg-pic-grp-b: var(--colorPaletteGreenBackground1);
  color: var(--colorNeutralForeground1);
  font-family: var(--fontFamilyBase);
}
.krusgraph-map h2,
.krusgraph-flow h2 {
  margin: 0 0 var(--spacingVerticalS);
  font-size: var(--fontSizeBase300);
  font-weight: var(--fontWeightSemibold);
}
.krusgraph-map .muted,
.krusgraph-flow .muted {
  color: var(--colorNeutralForeground3);
}
.krusgraph-map .kg-list,
.krusgraph-flow .kg-list {
  list-style: none;
  padding: 0;
}
.krusgraph-map .kgc-n.kg-key-passed rect:first-of-type,
.krusgraph-flow .kgc-n.kg-key-passed rect:first-of-type {
  stroke: var(--colorPaletteGreenForeground1);
  stroke-width: 2;
}
.krusgraph-map .kgc-n.kg-key-failed rect:first-of-type,
.krusgraph-flow .kgc-n.kg-key-failed rect:first-of-type {
  stroke: var(--colorPaletteRedForeground1);
  stroke-width: 2.6;
}
.krusgraph-map .kgc-e.kg-rv-accepted line,
.krusgraph-flow .kgc-e.kg-rv-accepted line {
  stroke-width: 2.6;
}
.krusgraph-map .kgc-n.kg-rv-accepted rect:first-of-type,
.krusgraph-flow .kgc-n.kg-rv-accepted rect:first-of-type {
  stroke-width: 2;
}

.krusgraph-flow {
  display: grid;
  gap: var(--spacingVerticalS);
  min-width: 0;
}
.krusgraph-flow .kgf-col {
  fill: var(--kg-muted);
  font-size: 11.5px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.krusgraph-flow .kgf-e {
  fill: none;
  stroke: var(--kg-pic-edge);
  stroke-width: 1.6;
}
.krusgraph-flow .kgf-e.off {
  stroke: var(--kg-muted);
  stroke-dasharray: 6 4;
}
.krusgraph-flow .kgf-n.off > rect {
  stroke-dasharray: 6 4;
  fill: var(--kg-bg);
}
.krusgraph-flow .kgf-n.off text {
  fill: var(--kg-muted);
}
.krusgraph-flow .kgf-bronze > rect {
  fill: var(--colorPaletteMarigoldBackground1);
}
.krusgraph-flow .kgf-gold > rect {
  stroke: var(--colorPaletteMarigoldBorderActive);
}
.krusgraph-flow .kgf-n.has-code {
  cursor: pointer;
}
.krusgraph-flow .kgf-n.has-code:focus {
  outline: none;
}
.krusgraph-flow .kgf-n.has-code:focus > rect,
.krusgraph-flow .kgf-n.has-code:hover > rect,
.krusgraph-flow .kgf-n.open > rect {
  stroke: var(--kg-pic-accent);
  stroke-width: 2.4;
}
.krusgraph-flow .kgf-more {
  fill: var(--kg-pic-accent);
  font-size: 15px;
  font-weight: 700;
}
.krusgraph-flow .krusgraph-flow-legend .lg.off::before {
  background: repeating-linear-gradient(90deg, var(--kg-muted) 0 5px, transparent 5px 8px);
}
.krusgraph-flow .krusgraph-flow-note {
  color: var(--kg-muted);
  margin: 0;
}

.krusgraph-code {
  border: 1px solid var(--colorNeutralStroke1);
  border-radius: var(--borderRadiusMedium);
  background: var(--colorNeutralBackground2);
  min-width: 0;
}
.krusgraph-code .krusgraph-code-head {
  display: flex;
  flex-wrap: wrap;
  gap: var(--spacingHorizontalS);
  align-items: center;
  padding: var(--spacingVerticalXS) var(--spacingHorizontalS);
  border-bottom: 1px solid var(--colorNeutralStroke2);
}
.krusgraph-code .krusgraph-code-lang {
  color: var(--colorNeutralForeground3);
  margin-right: auto;
}
.krusgraph-code pre {
  margin: 0;
  padding: var(--spacingVerticalS) var(--spacingHorizontalM);
  overflow: auto;
  max-height: 420px;
  font-family: var(--fontFamilyMonospace);
  font-size: var(--fontSizeBase200);
  line-height: 1.45;
  white-space: pre;
}

.krusgraph-outputs {
  display: grid;
  gap: var(--spacingVerticalS);
  max-width: 880px;
}

.krusgraph-output {
  display: grid;
  gap: var(--spacingVerticalXS);
  padding: var(--spacingVerticalS) var(--spacingHorizontalM);
  border: 1px solid var(--colorNeutralStroke2);
  border-radius: var(--borderRadiusMedium);
}

.krusgraph-output.refused {
  border-color: var(--colorPaletteRedBorder2);
}

.krusgraph-product {
  display: grid;
  gap: var(--spacingVerticalXS);
  padding: var(--spacingVerticalS) var(--spacingHorizontalM);
  border: 2px solid var(--colorBrandStroke1);
  border-radius: var(--borderRadiusLarge);
}

.krusgraph-steps {
  margin: 0;
  padding-left: 1.2em;
}

.krusgraph-item-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.krusgraph-item-icon {
  width: 20px;
  height: 20px;
  flex: none;
}

.krusgraph-notices {
  margin-top: 16px;
}
.krusgraph-notices summary {
  cursor: pointer;
}
.krusgraph-notices p {
  margin: 8px 0 0;
}

.krusgraph-swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 2px;
  vertical-align: -1px;
}

/* n197: the App's one command, wrapped on a phone, selectable as one block */
.krusgraph-one-command {
  display: block;
  padding: 8px 10px;
  border-radius: 4px;
  background: var(--colorNeutralBackground3, #f5f5f5);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  user-select: all;
}

@media (max-width: 600px) {
  .krusgraph-view {
    padding: 12px;
    gap: var(--spacingVerticalM);
    font-size: 14px;
    line-height: 20px;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .krusgraph-view .fui-Caption1,
  .krusgraph-view .fui-Caption2,
  .krusgraph-view .fui-Caption1Strong,
  .krusgraph-view .fui-Field__hint,
  .krusgraph-view .fui-Field__validationMessage,
  .krusgraph-view .fui-Badge,
  .krusgraph-view small {
    font-size: 14px;
    line-height: 20px;
  }
  .krusgraph-view .fui-Badge {
    height: auto;
    min-height: 24px;
    white-space: normal;
  }
  .krusgraph-row {
    grid-template-columns: minmax(0, 1fr);
    align-items: start;
    gap: var(--spacingVerticalXS);
  }
  .krusgraph-row-holds,
  .krusgraph-row-lost {
    grid-column: 1;
    justify-self: start;
    text-align: start;
  }
  .krusgraph-empty-form,
  .krusgraph-outputs {
    max-width: none;
  }
  .krusgraph-output,
  .krusgraph-product {
    padding: var(--spacingVerticalS);
    min-width: 0;
  }
  .krusgraph-view .fui-Button,
  .krusgraph-view .fui-Input,
  .krusgraph-view .fui-Dropdown,
  .krusgraph-view .fui-Combobox,
  .krusgraph-view .fui-Select,
  .krusgraph-view .fui-Tab,
  .krusgraph-view .fui-Link,
  .krusgraph-view summary,
  .krusgraph-view button,
  .krusgraph-view select,
  .krusgraph-view input[type=text] {
    min-height: 44px;
  }
  .krusgraph-view .fui-Button {
    max-width: 100%;
    white-space: normal;
    height: auto;
  }
  .krusgraph-view .fui-Checkbox,
  .krusgraph-view .fui-Radio,
  .krusgraph-view .fui-Switch {
    min-height: 44px;
    align-items: center;
  }
  .krusgraph-view .fui-Link {
    display: inline-flex;
    align-items: center;
  }
  .krusgraph-actions,
  .krusgraph-choices {
    align-items: stretch;
  }
  .krusgraph-map,
  .krusgraph-flow {
    max-width: 100%;
    overflow-x: auto;
  }
  .krusgraph-code pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
